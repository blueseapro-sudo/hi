<script type="application/json" id="course-data">{"course": {"title": "AI 이해부터 에이전트 개발까지", "start": "09:00", "files": {"kit": "kit/agent-lab.zip", "pdfAll": "pdf/aiax_all.pdf", "pdf": {"p00": "pdf/aiax_p00.pdf", "p01": "pdf/aiax_p01.pdf", "p02": "pdf/aiax_p02.pdf", "p03": "pdf/aiax_p03.pdf", "p04": "pdf/aiax_p04.pdf", "p05": "pdf/aiax_p05.pdf", "p06": "pdf/aiax_p06.pdf", "p90": "pdf/aiax_p90.pdf", "p95": "pdf/aiax_p95.pdf", "p97": "pdf/aiax_p97.pdf", "p99": "pdf/aiax_p99.pdf"}}}, "docs": [{"id": "p00", "file": "AIAX_00_강의안내.md", "title": "AI 이해부터 에이전트 개발까지 · 강의 안내", "navTitle": "강의 안내", "part": "안내", "order": 0.0, "time": "전체 3시간 15분 (휴식 별도)", "md": "---\ntitle: AI 이해부터 에이전트 개발까지 · 강의 안내\npart: 안내\norder: 0\ntime: 전체 3시간 15분 (휴식 별도)\ndesc: AI 지니와 함께 AI의 과거·현재를 이해하고, 내 업무 하나를 에이전트에게 맡기는 데까지 갑니다.\nnav: 강의 안내\ntags: [AI, AX, 교안, 에이전트, ClaudeCode]\ncreated: 2026-10-27\n---\n\n# AI 이해부터 에이전트 개발까지 (강의 안내)\n\n![[images/aiax_ig_00_overview.png|일곱 정거장을 지나면 내 일을 AI에게 맡길 수 있어요]]\n\n## 강의 순서\n\n| 강 | 주제 | 핵심 질문 | 시간 |\n|---|---|---|---|\n| 안내 | 과정 소개 | 오늘 무엇을 가져가나? | 5분 |\n| 1강 | AI의 태동과 역사 | AI는 어디서 왔나? | 25분 |\n| 2강 | AI 핵심 용어 | AI와 어떻게 말하고, 무엇을 경계하나? | 25분 |\n| 3강 | 생성형 AI 모델 연표 (2022~2026.10) | 지금 AI는 어디까지 왔나? | 25분 |\n| 4강 | 에이전트 환경과 지시 설계 | AI에게 일을 맡기려면 무엇을 준비하나? | 25분 |\n| 5강 | MCP·스킬·훅 | 에이전트에게 손발·매뉴얼·규칙을 어떻게 주나? | 25분 |\n| 6강 | 멀티에이전트와 업무 자동화 | 여러 에이전트로 일 하나를 끝까지 끝내려면? | 25분 |\n| 복습 | 1~6강 | 무엇을 배웠나? | 10분 |\n| 활용편 | 내 업무에 적용 | 이제 무엇을 맡길까? | 30분 |\n| 부록 | 실습 키트 | 지시문·소스를 복사해 바로 실습 | 실습용 |\n| 부록 | 약어 사전 | 이 약어는 무슨 뜻? | 참고용 |\n\n```mermaid\ngraph LR\n    A[\"1강 역사<br/>지니의 탄생\"] --> B[\"2강 용어<br/>소원 비는 법\"]\n    B --> C[\"3강 연표<br/>지니의 세대교체\"]\n    C --> D[\"4강 환경·지시<br/>지니에게 매뉴얼\"]\n    D --> E[\"5강 MCP·스킬·훅<br/>손발·업무수첩·규칙\"]\n    E --> F[\"6강 멀티에이전트<br/>지니 팀\"]\n    F --> R[\"복습\"]\n    R --> U[\"활용편<br/>내 업무에 지니\"]\n```\n\n## 전체를 꿰는 비유: 요술 램프 지니\n\n| 강 | 지니 이야기 | 실제 개념 |\n|---|---|---|\n| 1강 | 지니가 태어나기까지 70년 | 튜링 질문 → 겨울 → 딥러닝 → 대화형 AI |\n| 2강 | 소원을 정확히 비는 법 | 프롬프트, 리터러시 |\n| 3강 | 지니가 해마다 똑똑해진다 | 모델 세대교체, 추론, 에이전트 |\n| 4강 | 지니에게 업무 수첩을 준다 | CLAUDE.md, 권한, 계획 모드 |\n| 5강 | 지니에게 손발과 규칙을 준다 | MCP, 스킬, 훅 |\n| 6강 | 지니 여러 명이 팀으로 일한다 | 서브에이전트, 작성자·검토자 분리 |\n\n## 이 강의를 듣고 나면\n\n1. **이해**: AI가 걸어온 길과 핵심 용어, 2026년 현재 모델 지형을 설명한다.\n2. **판단**: 내 업무 중 AI에게 맡길 일과 맡기면 안 되는 일을 네 가지 기준으로 가른다.\n3. **실행**: CLAUDE.md, 스킬 1개, 검토 에이전트 1개로 반복 업무 1건을 자동화하는 첫 버전을 만든다.\n\n## 나는 누구일까요? 내 상황 고르기\n\n> [!persona-pick] 나는 어떤 일을 하나요?\n> - 현장 대원 (화재·구조·구급)\n> - 행정·사무\n> - 예방·안전\n> - 처음 배우는 분\n>\n> 사이트에서 고르면 강의 곳곳의 예시가 내 상황에 맞게 바뀝니다. 왼쪽 위 \"내 상황\"에서 언제든 바꿀 수 있습니다.\n\n## 대상과 준비물\n\n| 구분 | 내용 |\n|---|---|\n| 대상 | 소방공무원 교육생 (생성형 AI 사용 경험 기초, 코딩 비전공) |\n| 방식 | 설명 30% / 따라 하기 50% / 시연·질의 20% |\n| 준비물 | 노트북, Claude 계정, Node.js 18 이상, Git, 실습 폴더 `agent-lab` |\n| 1~3강 | 별도 설치 없이 들을 수 있음 |\n| 4~6강 | Claude Code 설치 필요 (사전 안내) |\n\n> [!warning] 실습 안내\n> 실습에는 실제 개인정보·내부 문서를 넣지 않습니다. 모든 실습 데이터는 가짜 예시 데이터를 씁니다.\n\n## 용어 사전\n\n| 용어 | 원어 | 쉬운 뜻 |\n|---|---|---|\n| 인공지능 | AI, Artificial Intelligence | 사람처럼 배우고 판단하는 기계 |\n| 머신러닝 | Machine Learning | 자료를 보고 기계가 스스로 규칙을 찾는 방식 |\n| 딥러닝 | Deep Learning | 인공 신경망을 여러 층 쌓아 배우는 방식 |\n| 거대언어모델 | LLM, Large Language Model | 엄청난 양의 글로 \"다음 말\"을 맞히며 배운 AI |\n| 모델 | Model | AI의 뇌. ChatGPT는 서비스, GPT-5는 모델 |\n| 프롬프트 | Prompt | AI에게 하는 말(지시) 전체 |\n| 컨텍스트 | Context | AI가 한 번에 보고 기억하는 자료의 범위 |\n| 추론 모델 | Reasoning Model | 답하기 전에 속으로 차근차근 생각하는 모델 |\n| 에이전트 | Agent | 목표를 주면 계획하고 도구를 써서 일을 끝내는 AI |\n| MCP | Model Context Protocol | 에이전트가 외부 도구·데이터에 연결되는 표준 규격 |\n| 스킬 | Skill | 반복 업무 절차를 묶은 에이전트용 업무 수첩 |\n| 훅 | Hook | 특정 시점에 무조건 실행되는 자동 규칙 |\n| AX | AI Transformation | AI로 일하는 방식 자체를 바꾸는 것 |\n\n> [!tip] 바로 가기\n> 실습에 쓰는 지시문과 소스는 [[AIAX_97_실습키트|실습 키트]]에서 복사합니다. 실습 폴더는 agent-lab.zip으로 함께 배포합니다.\n>\n> [[AIAX_01_AI의태동과역사|1강 AI의 태동과 역사]]부터 시작합니다. 시간이 부족하면 1~3강은 요약만, 4~6강은 실습 위주로 운영합니다.\n"}, {"id": "p01", "file": "AIAX_01_AI의태동과역사.md", "title": "1강 · AI의 태동과 역사", "navTitle": "1강. AI의 태동과 역사", "part": "본강", "order": 1.0, "time": "25분", "md": "---\ntitle: 1강 · AI의 태동과 역사\npart: 본강\norder: 1\ntime: 25분\ndesc: 생각하는 기계를 꿈꾼 1950년부터 일하는 AI까지, 겨울과 봄을 반복한 70년을 따라갑니다.\npractice: 20%\nnav: 1강. AI의 태동과 역사\ntags: [AI역사, 튜링, 딥러닝, 알파고]\n---\n\n# 1강. AI의 태동과 역사\n\n![[images/aiax_ig_01_history.png|AI가 자라 온 70년, 겨울을 지나 다시 달렸어요]]\n\n> [!question] 생각해 보기\n> 스마트폰 사진첩에 \"강아지\"라고 치면 강아지 사진만 모여 나옵니다. 누가 사진마다 \"강아지\"라고 적어 둔 걸까요? 아니라면 기계는 강아지를 어떻게 알아봤을까요?\n\n## 0. 한 줄 흐름\n\n```mermaid\ngraph LR\n    A[\"기계도 생각할까?<br/>1950 튜링\"] --> B[\"이름을 붙이자<br/>1956 다트머스\"]\n    B --> C[\"기대만큼 안 된다<br/>1970·80 AI 겨울\"]\n    C --> D[\"규칙 대신 자료로<br/>머신러닝\"]\n    D --> E[\"층을 깊게<br/>2010 딥러닝\"]\n    E --> F[\"말하는 AI<br/>2022 ChatGPT\"]\n    F --> G[\"일하는 AI<br/>에이전트\"]\n```\n\nAI 역사는 \"기대 → 실망 → 새 방법\"의 반복입니다. 각 단계는 앞 단계의 문제를 푼 해결책입니다.\n\n## 1. 문제: 기계가 생각한다는 걸 어떻게 알까 (1950년대)\n\n- **1950년, 앨런 튜링**: \"기계도 생각할 수 있을까?\"라는 질문을 던졌습니다. 커튼 뒤 상대가 사람인지 기계인지 구별하지 못하면 생각한다고 보자는 시험, **튜링 테스트(Turing Test)** 를 제안했습니다.\n- **1956년, 다트머스 회의**: 존 매카시가 처음으로 **인공지능(Artificial Intelligence)** 이라는 이름을 붙였습니다. 이 해를 AI의 생일로 봅니다.\n- **1958년, 퍼셉트론(Perceptron)**: 뇌의 신경세포를 흉내 낸 단순한 기계. 오늘날 신경망의 출발점입니다.\n\n> [!example] 생활 속 비유\n> 지니(AI)라는 아이디어가 처음 종이에 그려진 때입니다. 아직 램프 안에는 아무것도 없습니다.\n\n## 2. 문제: 기대만큼 똑똑하지 않다 → AI의 겨울 (1970~80년대)\n\n| 시기 | 무엇을 했나 | 왜 실패했나 |\n|---|---|---|\n| 1970년대 | \"몇 년이면 사람 수준\"이라 기대 | 컴퓨터가 느리고 배울 자료가 부족 |\n| 1980년대 | **전문가 시스템**: 전문가 지식을 \"만약 ~이면 ~이다\" 규칙으로 입력 | 세상일은 규칙으로 다 적을 수 없음. 규칙이 많아지자 관리 불가 |\n\n연구비가 끊긴 이 시기를 **AI의 겨울(AI Winter)** 이라고 부릅니다. 겨울은 두 번 왔습니다.\n\n> [!example] 바로 해 보기: 규칙으로 화재 판단하기\n> 1. 종이에 \"화재 신고가 진짜인지 판단하는 규칙\"을 5개만 적어 봅니다. (예: 연기 목격 + 냄새 = 진짜)\n> 2. 옆 사람이 규칙에 안 맞는 예외 상황을 하나 말해 봅니다.\n> 3. 규칙을 하나 더 추가합니다. 다시 예외를 찾습니다.\n> 성공 확인: 규칙이 끝없이 늘어나는 것을 체감하면 성공. 이것이 전문가 시스템이 무너진 이유입니다.\n\n## 3. 해결: 규칙을 사람이 쓰지 말고 기계가 찾게 하자 (1990~2000년대)\n\n- **1997년, 딥블루(Deep Blue)**: IBM 컴퓨터가 체스 챔피언 카스파로프를 이겼습니다. 방식은 엄청나게 빠른 계산이었습니다.\n- 이때부터 중심이 **머신러닝(Machine Learning)** 으로 바뀝니다. 강아지 사진 수만 장을 보여주면 기계가 스스로 강아지의 특징을 찾습니다.\n\n생각해 보기의 답이 여기 있습니다. 누가 사진마다 이름을 적은 게 아니라, 기계가 수많은 예시로 \"강아지다움\"을 스스로 배운 것입니다.\n\n## 4. 해결: 층을 깊게 쌓자, 딥러닝 혁명 (2010년대)\n\n세 가지가 동시에 갖춰지면서 AI가 갑자기 똑똑해졌습니다.\n\n| 재료 | 내용 |\n|---|---|\n| 많은 자료 | 인터넷·스마트폰으로 사진, 글, 영상이 넘쳐남 |\n| 빠른 계산 | 게임용 그래픽카드(GPU)가 AI 학습에 딱 맞음 |\n| 깊은 신경망 | 층을 여러 겹 쌓은 **딥러닝(Deep Learning)**. 겨울에도 연구를 이어 간 제프리 힌턴 등의 공로 |\n\n| 연도 | 사건 | 의미 |\n|---|---|---|\n| 2012 | 이미지 인식 대회에서 딥러닝이 압승 | 딥러닝 시대 개막 |\n| 2016 | 알파고, 이세돌 9단에 4:1 승리 | 바둑도 기계가 이긴다. 이세돌의 1승은 사람이 AI를 이긴 기념비적 대국 |\n| 2017 | 트랜스포머(Transformer) 발표 | 문장에서 중요한 단어에 집중하는 방법. 지금 대화형 AI의 뼈대 |\n\n> [!abstract] 약어 풀이\n> - GPU: Graphics Processing Unit, 그래픽 처리 장치\n> - GPT: Generative Pre-trained Transformer, 미리 학습한 생성형 트랜스포머\n\n## 5. 해결: 말하는 AI, 그리고 일하는 AI (2020년대~)\n\n- **2022년 11월, ChatGPT**: 누구나 AI와 대화하게 됐습니다. 이후 Claude, Gemini 등이 함께 발전합니다.\n- 이런 AI를 **거대언어모델(LLM)** 이라 합니다. 많은 글을 읽고 \"다음에 올 말\"을 맞히는 연습으로 글쓰기, 번역, 코딩까지 하게 됐습니다.\n- 지금은 대답을 넘어 스스로 계획하고 여러 단계를 처리하는 **에이전트(Agent)** 로 가는 중입니다. (3강, 4~6강에서 이어집니다)\n\n> [!example] 바로 해 보기: AI에게 AI 역사 묻기\n> 1. Claude나 ChatGPT에 \"AI의 겨울이 왜 왔는지 소방관에게 비유해서 3줄로 설명해줘\"라고 입력합니다.\n> 2. 답에서 연도나 인물이 나오면 이 교안의 표와 대조합니다.\n> 성공 확인: 틀린 연도나 지어낸 인물이 있는지 직접 찾아내면 성공. 이것이 2강의 \"리터러시\"입니다.\n\n## 정리\n\n### 1분 요약\n\n질문(1950) → 이름 짓기(1956) → 두 번의 겨울 → 스스로 배우는 기계 → 딥러닝 폭발 → 말하는 AI(2022) → 일하는 AI. 교훈은 \"겨울에도 포기하지 않은 사람들 덕분에 봄이 왔다\"입니다.\n\n### 문제 → 해결책 짝 맞추기\n\n| 문제 | 해결책 |\n|---|---|\n| 기계가 생각하는지 어떻게 아나 | 튜링 테스트 |\n| 규칙을 다 적을 수 없다 | 머신러닝 (자료로 스스로 학습) |\n| 얕은 신경망은 성능이 낮다 | 딥러닝 + GPU + 빅데이터 |\n| 긴 문장의 맥락을 놓친다 | 트랜스포머 |\n| 대답만 하고 일은 못 한다 | 에이전트 |\n\n### 이 단계에서 쓰는 도구\n\n- 대화형 AI (Claude, ChatGPT, Gemini) — 질문과 사실 확인 연습\n\n### 셀프 체크\n\n- [ ] AI라는 이름이 붙은 해와 회의를 말할 수 있다\n- [ ] AI의 겨울이 온 이유 두 가지를 말할 수 있다\n- [ ] 딥러닝 혁명의 세 재료를 말할 수 있다\n- [ ] 트랜스포머가 무엇의 뼈대인지 안다\n\n### AI에게 더 잘 요청하기\n\n| 막연한 요청 | 용어를 넣은 요청 |\n|---|---|\n| AI 역사 알려줘 | AI의 겨울과 딥러닝 혁명을 연도표로, 각 3줄씩 정리해줘 |\n| 알파고 설명해줘 | 딥블루의 계산 방식과 알파고의 학습 방식 차이를 표로 비교해줘 |\n\n### 더 찾아볼 곳\n\n- [Wikipedia: History of artificial intelligence](https://en.wikipedia.org/wiki/History_of_artificial_intelligence)\n- [Wikipedia: AI winter](https://en.wikipedia.org/wiki/AI_winter)\n- 논문: Vaswani et al., \"Attention Is All You Need\" (2017)\n\n```quiz\n{\"title\":\"1강 확인 퀴즈\",\"questions\":[\n{\"q\":\"'인공지능'이라는 이름이 처음 붙은 사건은?\",\"options\":[\"1950년 튜링 논문\",\"1956년 다트머스 회의\",\"1997년 딥블루 승리\",\"2016년 알파고 대국\"],\"answer\":1,\"explain\":\"1956년 다트머스 회의에서 존 매카시가 Artificial Intelligence라는 이름을 붙였습니다.\"},\n{\"q\":\"1980년대 전문가 시스템이 한계에 부딪힌 주된 이유는?\",\"options\":[\"전기가 부족해서\",\"세상일을 규칙으로 다 적을 수 없어서\",\"인터넷이 너무 빨라서\",\"GPU가 너무 비싸서\"],\"answer\":1,\"explain\":\"규칙이 끝없이 늘어 관리할 수 없게 되면서 두 번째 겨울이 왔습니다.\"},\n{\"q\":\"딥러닝 혁명의 세 재료가 아닌 것은?\",\"options\":[\"많은 자료\",\"빠른 계산(GPU)\",\"깊은 신경망\",\"전문가가 직접 쓴 규칙\"],\"answer\":3,\"explain\":\"직접 쓴 규칙은 전문가 시스템의 방식입니다.\"},\n{\"q\":\"지금 대화형 AI 대부분의 뼈대가 된 2017년 기술은?\",\"options\":[\"퍼셉트론\",\"트랜스포머\",\"딥블루\",\"튜링 테스트\"],\"answer\":1,\"explain\":\"트랜스포머는 문장 속 중요한 단어에 집중하는 방법으로, GPT의 T도 트랜스포머입니다.\"},\n{\"q\":\"대답을 넘어 스스로 계획하고 도구를 써서 일을 끝내는 AI를 무엇이라 하나?\",\"options\":[\"챗봇\",\"에이전트\",\"전문가 시스템\",\"퍼셉트론\"],\"answer\":1,\"explain\":\"에이전트는 4~6강의 주제입니다.\"}\n]}\n```\n"}, {"id": "p02", "file": "AIAX_02_AI핵심용어.md", "title": "2강 · AI 핵심 용어와 반짝 단어", "navTitle": "2강. AI 핵심 용어", "part": "본강", "order": 2.0, "time": "25분", "md": "---\ntitle: 2강 · AI 핵심 용어와 반짝 단어\npart: 본강\norder: 2\ntime: 25분\ndesc: 리터러시, 프롬프트, 모델, 특이점처럼 자주 듣는 말이 어디서 왔고 지금은 어떻게 쓰이는지 익힙니다.\npractice: 40%\nnav: 2강. AI 핵심 용어\ntags: [리터러시, 프롬프트, 노코드, 피지컬AI, 특이점]\n---\n\n# 2강. AI 핵심 용어와 반짝 단어\n\n![[images/aiax_ig_02_words.png|어려운 AI 말을 그림으로 풀어 본 사전]]\n\n> [!question] 생각해 보기\n> 2023년에는 \"프롬프트 엔지니어, 억대 연봉\"이라는 뉴스가 쏟아졌습니다. 지금 주변에 그 직함을 가진 사람이 있나요? 그 직업은 어디로 갔을까요?\n\n## 0. 한 줄 흐름\n\n```mermaid\ngraph LR\n    A[\"AI가 엉뚱한 말을 한다\"] --> B[\"리터러시<br/>의심하는 힘\"]\n    B --> C[\"원하는 답이 안 나온다\"]\n    C --> D[\"프롬프트<br/>소원을 정확히\"]\n    D --> E[\"요령이 직업이 됐다가 사라진다\"]\n    E --> F[\"컨텍스트 엔지니어링<br/>자료를 함께 쥐여준다\"]\n    F --> G[\"화면 밖으로, 격차, 특이점\"]\n```\n\n각 단어는 \"어디서 왔나 → 쉬운 비유 → 지금은?\" 순서로 봅니다.\n\n## 1. 문제: AI가 그럴듯하게 틀린다 → 리터러시\n\n- **어디서 왔나**: 리터러시(Literacy)는 원래 \"글을 읽고 쓰는 힘\". 컴퓨터 리터러시 → 디지털 리터러시 → **AI 리터러시**로 이어졌습니다.\n- **뜻**: AI와 대화하는 법, AI가 틀릴 때 알아채는 법을 아는 힘.\n- AI가 사실이 아닌 것을 그럴듯하게 지어내는 현상을 **환각(Hallucination)** 이라 부릅니다.\n\n> [!example] 생활 속 비유\n> AI가 \"고래는 하늘을 날아요\"라고 해도 \"어? 이상한데?\" 하고 의심할 줄 아는 힘. 지니가 가끔 거짓 소원을 들어줄 때 알아채는 눈입니다.\n\n## 2. 문제: 원하는 답이 안 나온다 → 프롬프트\n\n- **어디서 왔나**: 연극에서 대사를 까먹은 배우에게 몰래 속삭여 주는 사람이 프롬프터(Prompter). 컴퓨터에서는 명령어 입력 자리. 지금은 **AI에게 하는 말 전체**를 프롬프트(Prompt)라 부릅니다.\n\n> [!example] 생활 속 비유\n> 지니에게 \"과자 줘\"보다 \"초코 과자 세 개, 부서지지 않은 걸로\"라고 해야 원하는 게 나옵니다.\n\n> [!example] 바로 해 보기: 같은 일, 두 가지 소원\n> 1. AI에 \"소방 안전교육 자료 만들어줘\"라고 입력합니다.\n> 2. 새 대화에서 \"초등 3학년 대상, 10분짜리 화재 대피 안전교육 대본. 질문 2개 포함, 쉬운 말\"이라고 입력합니다.\n> 3. 두 결과를 나란히 봅니다.\n> 성공 확인: 두 번째가 바로 쓸 수 있는 수준이면 성공. 차이는 대상·분량·형식을 넣었느냐입니다.\n\n> [!persona-field] 현장 대원이라면 이렇게 부탁해 보세요\n> \"야간 화재 출동을 마친 뒤 장비 점검 순서를 신규 대원용 체크리스트 10줄로 써줘. 장비 이름은 빈칸으로 두고, 꼭 확인할 것에는 별표를 붙여줘.\"\n\n> [!persona-admin] 행정·사무라면 이렇게 부탁해 보세요\n> \"물품 구입 품의 초안을 1쪽으로 써줘. 품목·수량·금액은 빈칸으로 두고, 관련 근거 조항이 들어갈 자리를 표시해줘.\"\n\n> [!persona-prev] 예방·안전이라면 이렇게 부탁해 보세요\n> \"아파트 관리소장에게 보낼 소방시설 자체점검 안내문을 300자로 써줘. 점검 기한과 미이행 시 불이익을 쉬운 말로 넣어줘.\"\n\n> [!persona-general] 처음 배우는 분이라면 이렇게 부탁해 보세요\n> \"우리 집 화재 대피 계획을 가족 4명 기준으로 짜줘. 초등학생도 읽을 수 있게 짧은 문장으로 써줘.\"\n\n## 3. 문제: 요령이 직업이 됐다가 사라진다 → 프롬프트 엔지니어의 흥망\n\n| 단계 | 내용 |\n|---|---|\n| 등장 | 2022년 말 초기 AI는 말귀가 어두워 \"단계별로 생각해봐\" 한 줄로 답이 확 좋아지는 요령이 통함 |\n| 반짝 | 2023년 3월 Anthropic의 프롬프트 엔지니어 공고에 연봉 최대 33만 5천 달러가 붙어 화제 |\n| 시듦 | AI가 똑똑해져 대충 말해도 알아듣고, 요령이 다 알려져 모두의 기본기가 됨 |\n| 지금 | **컨텍스트 엔지니어링**으로 이동. 주문 한 줄보다 어떤 자료·상황을 같이 쥐여주느냐가 중요 |\n\n> [!example] 생활 속 비유\n> 지니가 귀가 어두워 \"지니 말 통역사\"가 필요했는데, 지니가 보청기를 끼자 통역사가 할 일이 없어졌습니다.\n\n## 4. 문제: 코딩을 몰라 만들지 못한다 → 노코드에서 바이브 코딩으로\n\n- **노코드(No-code)**: 2010년대 블록을 끌어 붙여 앱을 만드는 도구(Bubble, Webflow 등)가 퍼지며 유행.\n- **바이브 코딩(Vibe coding)**: 2025년 무렵부터 \"이런 앱 만들어줘\"라고 말하면 AI가 코드를 대신 짜는 방식이 그 자리를 차지.\n\n> [!example] 생활 속 비유\n> 집은 목수만 지었다 → 레고로 누구나 지었다 → 이제 \"빨간 지붕 집 지어줘\"라고 말하면 로봇이 레고를 조립합니다.\n\n## 5. 기본 단어: 모델\n\n- **어디서 왔나**: 모형 비행기처럼 진짜를 흉내 낸 것. 날씨 모델처럼 현상을 흉내 낸 계산식.\n- **AI 모델**: 엄청난 글과 그림을 보고 \"세상이 대충 이렇게 돌아가더라\"를 흉내 내는 계산 덩어리.\n- 서비스와 모델은 다릅니다. ChatGPT·Claude는 서비스, GPT-5·Claude Opus 5.5는 그 안의 모델. (3강에서 연표로)\n\n## 6. 문제: AI가 화면 안에만 있다 → 피지컬 AI\n\n- **피지컬 AI(Physical AI)**: 몸을 가진 AI. 로봇, 자율주행차, 드론이 여기에 들어갑니다. 2025년 초 엔비디아가 강조하며 크게 퍼진 말입니다.\n- 소방에서는 드론, 정찰·소화 로봇이 해당합니다.\n\n## 7. 문제: 쓰는 사람과 못 쓰는 사람이 벌어진다 → 격차\n\n- **AI 격차(AI Divide)**: 1990년대 \"디지털 격차\"에서 이어진 말. AI를 잘 쓰는 사람·조직·나라와 못 쓰는 쪽의 차이.\n- 리터러시와 짝꿍 단어입니다. 격차를 줄이는 방법이 리터러시 교육입니다.\n\n## 8. 먼 이야기: 특이점\n\n- **특이점(Singularity)**: 원래 물리학 용어로 기존 규칙이 깨지는 지점. 1993년 SF 작가 버너 빈지가 \"AI가 사람보다 똑똑해지는 순간\"에 붙였고, 레이 커즈와일이 2045년 무렵을 예측해 유명해졌습니다.\n- 아직 오지 않았고, 온다·안 온다는 지금도 논쟁 중입니다.\n\n## 9. 함께 반짝했다 시든 말들\n\n| 단어 | 반짝했을 때 | 지금 |\n|---|---|---|\n| 프롬프트 엔지니어 | 2023년 억대 연봉 화제 | 모두의 기본기, 컨텍스트 엔지니어링으로 이동 |\n| 노코드 | 2010년대 후반~2022 | 바이브 코딩에 자리 넘김 |\n| 메타버스 | 2021년 페이스북이 사명을 메타로 변경 | AI 열풍에 밀려 조용해짐 (업계 평가) |\n| AutoGPT | 2023년 4월 GitHub 트렌딩 1위 | 실제로는 산만해 식었다가 지금의 에이전트로 다시 태어남 |\n| GPT 스토어 | 2024년 1월 출시, \"AI 앱스토어\" 기대 | 기대만큼 크지 않음 (업계 평가) |\n\n> [!tip] 핵심\n> AI가 빨리 똑똑해지면 \"AI를 다루는 요령\"으로 생긴 직업과 단어는 금방 사라집니다. 남는 것은 리터러시처럼 **판단하는 힘**입니다.\n\n> [!example] 바로 해 보기: 반짝 단어 찾기\n> 1. 3명이 한 조가 되어 최근 1년간 들은 AI 유행어 3개를 적습니다.\n> 2. 각 단어를 \"문제 → 해결\" 문장으로 바꿔 봅니다. (예: 바이브 코딩 = 코딩을 몰라도 만들고 싶다 → 말로 시킨다)\n> 성공 확인: 문제를 한 문장으로 못 쓰는 단어는 유행어일 가능성이 높습니다.\n\n## 정리\n\n### 1분 요약\n\n리터러시는 의심하는 힘, 프롬프트는 소원을 정확히 비는 법. 프롬프트 엔지니어·노코드처럼 요령에서 나온 말은 AI가 똑똑해지면 사라지고, 판단하는 힘은 남습니다.\n\n### 문제 → 해결책 짝 맞추기\n\n| 문제 | 해결책(용어) |\n|---|---|\n| AI가 그럴듯하게 틀린다 | AI 리터러시 |\n| 원하는 답이 안 나온다 | 프롬프트 (대상·분량·형식 명시) |\n| 주문 한 줄로는 부족하다 | 컨텍스트 엔지니어링 |\n| 코딩을 몰라 못 만든다 | 노코드 → 바이브 코딩 |\n| AI가 화면 안에만 있다 | 피지컬 AI |\n| 쓰는 사람만 앞서간다 | 격차 해소를 위한 리터러시 교육 |\n\n### 이 단계에서 쓰는 도구\n\n- 대화형 AI — 같은 일을 두 가지 프롬프트로 비교\n- 검색 — AI 답의 사실 확인\n\n### 셀프 체크\n\n- [ ] 환각이 무엇인지 예를 들어 말할 수 있다\n- [ ] 프롬프트에 넣을 요소 세 가지를 말할 수 있다\n- [ ] 프롬프트 엔지니어가 시든 이유를 말할 수 있다\n- [ ] 서비스 이름과 모델 이름을 구분한다\n\n### AI에게 더 잘 요청하기\n\n| 막연한 요청 | 용어를 넣은 요청 |\n|---|---|\n| 보고서 써줘 | 이 표(붙임)를 근거로, 과장 보고용 1쪽, 표 1개, 출처 없는 수치는 쓰지 마 |\n| 이거 맞아? | 이 답에서 사실 확인이 필요한 문장만 골라 근거와 함께 표시해줘 |\n\n### 더 찾아볼 곳\n\n- [Bloomberg: 프롬프트 엔지니어 연봉 보도 (2023.3)](https://www.bloomberg.com/news/articles/2023-03-29/ai-chatgpt-related-prompt-engineer-jobs-pay-up-to-335-000)\n- [Wikipedia: AutoGPT](https://en.wikipedia.org/wiki/AutoGPT)\n- [AP/OPB: 페이스북, 메타로 사명 변경 (2021.10)](https://opb.org/article/2021/10/28/facebook-rebrands-as-meta-to-emphasize-metaverse-vision)\n\n```quiz\n{\"title\":\"2강 확인 퀴즈\",\"questions\":[\n{\"q\":\"AI가 사실이 아닌 내용을 그럴듯하게 지어내는 현상은?\",\"options\":[\"특이점\",\"환각\",\"격차\",\"추론\"],\"answer\":1,\"explain\":\"환각(Hallucination)을 알아채는 힘이 리터러시입니다.\"},\n{\"q\":\"프롬프트 엔지니어라는 직함이 시든 이유로 가장 알맞은 것은?\",\"options\":[\"법으로 금지되어서\",\"AI가 똑똑해져 요령이 모두의 기본기가 되어서\",\"연봉이 너무 낮아서\",\"인터넷이 끊겨서\"],\"answer\":1,\"explain\":\"지금은 자료와 상황을 함께 주는 컨텍스트 엔지니어링으로 관심이 옮겨갔습니다.\"},\n{\"q\":\"말로 설명하면 AI가 코드를 대신 짜 주는 방식은?\",\"options\":[\"노코드\",\"바이브 코딩\",\"전문가 시스템\",\"메타버스\"],\"answer\":1,\"explain\":\"바이브 코딩이 노코드의 자리를 이어받았습니다.\"},\n{\"q\":\"로봇·드론·자율주행차처럼 몸을 가진 AI는?\",\"options\":[\"피지컬 AI\",\"생성형 AI\",\"오픈 모델\",\"GPT 스토어\"],\"answer\":0,\"explain\":\"화면 밖에서 실제로 움직이는 AI입니다.\"},\n{\"q\":\"리터러시와 짝꿍인 단어로, 쓰는 사람과 못 쓰는 사람의 차이를 뜻하는 것은?\",\"options\":[\"특이점\",\"격차\",\"환각\",\"모델\"],\"answer\":1,\"explain\":\"격차를 줄이는 방법이 리터러시 교육입니다.\"}\n]}\n```\n"}, {"id": "p03", "file": "AIAX_03_생성형AI모델연표.md", "title": "3강 · 생성형 AI 모델 연표 (2022.11~2026.10)", "navTitle": "3강. 모델 연표 2022~2026", "part": "본강", "order": 3.0, "time": "25분", "md": "---\ntitle: 3강 · 생성형 AI 모델 연표 (2022.11~2026.10)\npart: 본강\norder: 3\ntime: 25분\ndesc: ChatGPT 이후 4년, 말하는 AI에서 스스로 일하는 AI까지 네 번의 변화를 연표로 봅니다.\npractice: 20%\nnav: 3강. 모델 연표 2022~2026\ntags: [AI모델, 연표, GPT, Claude, Gemini, 에이전트]\n기준일: 2026-10-15\n---\n\n# 3강. 생성형 AI 모델 연표 (2022.11~2026.10)\n\n![[images/aiax_ig_03_timeline.png|말하는 아기에서 심부름하는 비서까지, AI의 네 막]]\n\n> [!question] 생각해 보기\n> 2년 전 쓰던 스마트폰과 지금 스마트폰은 얼마나 다른가요? AI 모델은 같은 기간에 몇 번 바뀌었을까요?\n\n## 0. 한 줄 흐름\n\n```mermaid\ngraph LR\n    A[\"1막 2022~2023<br/>말하는 AI\"] --> B[\"2막 2024<br/>보고 듣는 AI\"]\n    B --> C[\"3막 2025<br/>생각하고 코딩하는 AI\"]\n    C --> D[\"4막 2026<br/>스스로 일하는 AI\"]\n```\n\n![[images/aiax_timeline_2022-2026.png|회사별 주요 모델 출시 시점 (기준일 2026.10.15)]]\n\nChatGPT 이후 4년 동안 AI는 네 번 모습을 바꿨습니다. 각 막은 앞 막의 한계를 푼 결과입니다.\n\n## 1. 1막: 말하는 AI (2022.11~2023)\n\n> [!tip] 핵심\n> 누구나 AI와 대화하게 된 시기. 문제는 \"글만 안다\"는 것.\n\n| 시기 | 회사 | 모델 | 새로웠던 점 |\n|---|---|---|---|\n| **2022.11.30** | OpenAI | **ChatGPT (GPT-3.5)** | 대화형 AI 대중화의 시작 |\n| 2023.02 | Meta | LLaMA | 설계도 공개 → 오픈 모델 시대 |\n| **2023.03.14** | OpenAI | **GPT-4** | 사진 이해, 시험 상위권 수준 |\n| 2023.03.14 | Anthropic | Claude 1 | 안전성을 내세운 첫 Claude |\n| 2023.08 | 네이버 | HyperCLOVA X | 한국어 특화 국산 모델 |\n| 2023.12 | Google | Gemini 1.0 | 글·그림·소리를 함께 배운 모델 |\n\n## 2. 2막: 보고 듣는 AI (2024)\n\n> [!tip] 핵심\n> **멀티모달(Multimodal)**: 그림·소리·영상까지 이해. 그리고 **추론 모델**이 처음 등장.\n\n| 시기 | 회사 | 모델 | 새로웠던 점 |\n|---|---|---|---|\n| 2024.03 | Anthropic | Claude 3 (Opus·Sonnet·Haiku) | 큰·중간·작은 3종 구성 |\n| **2024.05** | OpenAI | **GPT-4o** | 실시간 음성 대화 |\n| 2024.06 | Anthropic | Claude 3.5 Sonnet | 코딩 실력 급상승 |\n| **2024.09** | OpenAI | **o1** | 답하기 전에 생각하는 첫 추론 모델 |\n| 2024.10 | Anthropic | 컴퓨터 사용 기능 | AI가 마우스·키보드로 컴퓨터 조작 |\n| 2024.12 | DeepSeek | DeepSeek-V3 | 중국의 저비용 고성능 모델 |\n\n## 3. 3막: 생각하고 코딩하는 AI (2025)\n\n> [!tip] 핵심\n> 저비용 충격과 **AI 코딩** 시대. AI가 몇 시간씩 혼자 프로그램을 짜기 시작.\n\n| 시기 | 회사 | 모델 | 새로웠던 점 |\n|---|---|---|---|\n| **2025.01.20** | DeepSeek | **DeepSeek-R1** | 적은 비용으로 o1급 성능, 세계 주가 출렁 |\n| 2025.02 | Anthropic | Claude 3.7 Sonnet + Claude Code | 터미널에서 코딩하는 에이전트 도구 |\n| 2025.05 | Anthropic | Claude 4 | 장시간 자율 코딩 |\n| 2025.08 | 한국 정부 | 독자 AI 파운데이션 모델 사업 착수 | 국가대표 AI 육성 |\n| **2025.08.07** | OpenAI | **GPT-5** | 빠른 답·깊은 생각 자동 전환 |\n| 2025.11 | Google / Anthropic | Gemini 3, Claude Opus 4.5 | 최상위권 경쟁 |\n\n## 4. 4막: 스스로 일하는 AI, 에이전트 (2026.01~10)\n\n> [!important] 이 강의의 핵심\n> 2026년에는 한두 달마다 새 모델이 나왔습니다. 키워드는 **에이전트, 보안, 가격 하락, 100만 토큰 기억력**.\n\n| 날짜 | 회사 | 모델 | 새로웠던 점 |\n|---|---|---|---|\n| 2026.02.05 | Anthropic | Claude Opus 4.6 | 100만 토큰 컨텍스트 |\n| 2026.02.19 | Google | Gemini 3.1 Pro | 어려운 추론 성능 대폭 향상 |\n| **2026.04.07** | Anthropic | **Claude Mythos Preview** | 보안 취약점 탐지 능력이 너무 강해 일반 공개 대신 소수 협력기관에만 제공 (Project Glasswing) |\n| 2026.04.08 | Meta | Muse Spark | Llama 대신 새 이름 |\n| **2026.04.23** | OpenAI | **GPT-5.5** | 에이전트 코딩 강화 |\n| 2026.04.24 | DeepSeek | DeepSeek V4 | 100만 토큰 기본, 저가 오픈 모델 |\n| **2026.06.09** | Anthropic | **Claude Fable 5 / Mythos 5** | Mythos급 모델 첫 일반 공개 (Fable은 안전장치 추가판) |\n| 2026.07.09 | OpenAI | GPT-5.6 | 크기별 3종 |\n| 2026.08.18 | 한국 정부 | 독파모 2차 평가 | LG·SKT·업스테이지 통과 |\n| **2026.09.22** | Anthropic | **Claude Opus 5.5** | 상위 성능을 더 싼 가격에 |\n| 2026.09.28 | Anthropic | Claude Sonnet 5.5 | 더 빠른 중형 모델 |\n| **2026.10.07** | OpenAI | **GPT-6** | 답변 안에 차트·버튼·계산기가 들어가는 화면 |\n\n> [!info] 아직 나오지 않은 것 (2026.10.15 기준)\n> Google Gemini 4(연내 예고), xAI Grok 5(학습 중). 강의 직전 다시 확인합니다.\n\n### 2026년의 다섯 가지 흐름\n\n1. **에이전트**: 대답하는 AI에서 몇 시간씩 혼자 일하는 AI로\n2. **보안**: 너무 강해서 공개를 제한하는 모델까지 등장\n3. **가격 하락**: 더 싸고 빠른 고성능 모델\n4. **긴 기억력**: 100만 토큰(책 여러 권)을 한 번에 읽는 것이 기본\n5. **나라별 경쟁**: 미국 대 중국, 한국은 독자 AI 파운데이션 모델\n\n> [!example] 바로 해 보기: 내가 쓰는 AI는 몇 막인가\n> 1. 지금 쓰는 AI 서비스를 열고 \"너는 어떤 모델이야?\"라고 묻거나 화면의 모델 선택 메뉴를 확인합니다.\n> 2. 위 표에서 그 모델을 찾아 몇 막인지 표시합니다.\n> 3. 같은 회사의 최신 모델과 출시일 차이를 계산합니다.\n> 성공 확인: 내가 쓰는 모델이 최신에서 몇 개월 뒤처졌는지 말할 수 있으면 성공.\n\n## 5. 회사별 한눈에 보기\n\n| 회사 | 서비스 | 2022 → 2026 흐름 |\n|---|---|---|\n| OpenAI | ChatGPT | GPT-3.5 → 4 → 4o → o1 → 5 → 5.5 → 6 |\n| Anthropic | Claude | Claude 1 → 3 → 3.5 → 4 → 4.5~4.8 → Fable·Mythos 5 → Opus·Sonnet·Haiku 5.5 |\n| Google | Gemini | Bard → Gemini 1.0 → 2.5 → 3 → 3.1 → 3.5 Flash |\n| Meta | Meta AI | LLaMA → Llama 4 → Muse Spark |\n| 중국 | DeepSeek, Kimi | DeepSeek-V3 → R1 → V4 / Kimi K2 → K3 |\n| 한국 | 클로바X, 엑사원 등 | HyperCLOVA X → EXAONE → 독파모 |\n\n> [!example] 생활 속 비유\n> - 2022년 AI: 말을 막 배운 아기. 대답은 잘하는데 가끔 엉뚱함\n> - 2024년 AI: 눈과 귀가 생긴 어린이\n> - 2025년 AI: 문제를 풀기 전에 생각하는 학생\n> - 2026년 AI: 심부름을 맡기면 혼자 계획해 끝내는 비서. 다음 4~6강은 이 비서를 부리는 법입니다\n\n## 정리\n\n### 1분 요약\n\n말하는 AI(2022) → 보고 듣는 AI(2024) → 생각하고 코딩하는 AI(2025) → 스스로 일하는 AI(2026). 모델은 매달 바뀌므로 이름을 외우기보다 \"몇 막인가\"로 위치를 잡습니다.\n\n### 문제 → 해결책 짝 맞추기\n\n| 문제 | 해결책 |\n|---|---|\n| 글만 이해한다 | 멀티모달 (GPT-4o, Gemini) |\n| 바로 답해서 틀린다 | 추론 모델 (o1 이후) |\n| 비싸다 | 저비용 모델 (DeepSeek-R1, Opus 5.5) |\n| 긴 자료를 못 읽는다 | 100만 토큰 컨텍스트 |\n| 대답만 하고 일은 못 한다 | 에이전트 (Claude Code 등) |\n\n### 이 단계에서 쓰는 도구\n\n- 각 서비스의 모델 선택 메뉴, 공식 발표 페이지\n\n### 셀프 체크\n\n- [ ] 4막의 이름을 순서대로 말할 수 있다\n- [ ] 첫 추론 모델과 출시 시기를 말할 수 있다\n- [ ] Mythos Preview가 일반 공개되지 않은 이유를 말할 수 있다\n- [ ] 내가 쓰는 모델이 몇 막인지 안다\n\n### AI에게 더 잘 요청하기\n\n| 막연한 요청 | 용어를 넣은 요청 |\n|---|---|\n| 요즘 AI 뭐가 좋아? | 문서 요약·표 작성 업무 기준으로, 추론 모델과 일반 모델 중 무엇이 맞는지 이유와 함께 |\n| 최신 모델 알려줘 | 오늘 기준 공식 발표된 모델만, 발표일과 출처 링크 포함 |\n\n### 더 찾아볼 곳\n\n- [Wikipedia: 2022 in artificial intelligence](https://en.wikipedia.org/wiki/2022_in_artificial_intelligence)\n- [Anthropic Project Glasswing](https://www.anthropic.com/glasswing)\n- [독자 AI 파운데이션 모델 2차 평가 결과 (바이라인네트워크)](https://byline.network/2026/08/0818-7/)\n- [2026년 모델 출시 목록 (BridgeBench)](https://www.bridgebench.ai/blog/ai-coding-model-releases-2026)\n\n> [!warning] 강사 메모\n> 날짜는 공식 발표 또는 주요 보도의 첫 공개일 기준입니다. 모델은 매달 바뀌므로 강의 전날 최신 출시를 다시 확인하고 표를 고칩니다.\n\n```quiz\n{\"title\":\"3강 확인 퀴즈\",\"questions\":[\n{\"q\":\"대화형 AI 대중화의 시작이 된 서비스와 출시 시기는?\",\"options\":[\"GPT-4, 2023년 3월\",\"ChatGPT, 2022년 11월\",\"Gemini, 2023년 12월\",\"Claude, 2023년 3월\"],\"answer\":1,\"explain\":\"2022년 11월 30일 ChatGPT가 1막을 열었습니다.\"},\n{\"q\":\"답하기 전에 속으로 생각하는 첫 추론 모델은?\",\"options\":[\"GPT-4o\",\"o1\",\"LLaMA\",\"Claude 3\"],\"answer\":1,\"explain\":\"OpenAI o1, 2024년 9월입니다.\"},\n{\"q\":\"적은 비용으로 고성능을 내 2025년 1월 세계를 놀라게 한 모델은?\",\"options\":[\"DeepSeek-R1\",\"Muse Spark\",\"GPT-5\",\"HyperCLOVA X\"],\"answer\":0,\"explain\":\"DeepSeek-R1이 3막의 저비용 충격입니다.\"},\n{\"q\":\"보안 능력이 너무 강해 일반 공개 대신 소수 기관에만 제공된 모델은?\",\"options\":[\"Claude Sonnet 5.5\",\"GPT-6\",\"Claude Mythos Preview\",\"Gemini 3.1 Pro\"],\"answer\":2,\"explain\":\"Project Glasswing을 통해 제한 제공되었습니다.\"},\n{\"q\":\"2026년(4막)의 핵심 키워드가 아닌 것은?\",\"options\":[\"에이전트\",\"가격 하락\",\"100만 토큰\",\"전문가 시스템\"],\"answer\":3,\"explain\":\"전문가 시스템은 1980년대 방식입니다.\"}\n]}\n```\n"}, {"id": "p04", "file": "AIAX_04_에이전트환경과지시설계.md", "title": "4강 · 에이전트 환경과 지시 설계", "navTitle": "4강. 에이전트 환경·지시 설계", "part": "본강", "order": 4.0, "time": "25분", "md": "---\ntitle: 4강 · 에이전트 환경과 지시 설계\npart: 본강\norder: 4\ntime: 25분\ndesc: 에이전트를 설치하고 업무 수첩(CLAUDE.md), 권한, 지시 4요소, 계획 모드로 일을 맡기는 법을 익힙니다.\npractice: 60%\nnav: 4강. 에이전트 환경·지시 설계\ntags: [에이전트, ClaudeCode, CLAUDE.md, 계획모드, 컨텍스트]\n---\n\n# 4강. 에이전트 환경과 지시 설계\n\n![[images/aiax_ig_04_agent.png|에이전트는 부탁 받기 → 계획 → 도구로 하기 → 확인을 반복해요]]\n\n> [!question] 생각해 보기\n> 신규 직원에게 \"보고서 만들어 와\"라고만 하면 무엇이 돌아올까요? 일을 제대로 맡기려면 무엇을 먼저 알려 줘야 할까요?\n\n## 0. 한 줄 흐름\n\n```mermaid\ngraph LR\n    A[\"챗봇은 답만 준다\"] --> B[\"에이전트<br/>목표→계획→실행→확인\"]\n    B --> C[\"매번 규칙을 설명해야 한다\"] --> D[\"CLAUDE.md<br/>업무 수첩\"]\n    D --> E[\"위험한 일까지 한다\"] --> F[\"권한 설정\"]\n    F --> G[\"결과가 엉뚱하다\"] --> H[\"지시 4요소<br/>+ 계획 모드\"]\n    H --> I[\"대화가 길어져 흐려진다\"] --> J[\"컨텍스트 관리\"]\n```\n\n## 1. 문제: 챗봇은 답만 준다 → 에이전트\n\n| 구분 | 챗봇 | 에이전트 |\n|---|---|---|\n| 입력 | 질문 | 목표 |\n| 동작 | 1회 응답 | 계획 → 도구 실행 → 결과 확인 반복 |\n| 도구 | 없음 | 파일, 터미널, 웹, 외부 서비스 |\n| 결과물 | 텍스트 | 파일, 실행된 작업 |\n\n**에이전트 루프**: 목표 → 계획 → 도구 호출 → 관찰 → 수정 → 완료. 오늘 쓰는 도구는 **Claude Code**(터미널·데스크톱에서 일하는 Claude 에이전트)입니다.\n\n> [!example] 바로 해 보기: 설치와 첫 실행\n> 1. 터미널을 열고 아래를 입력합니다.\n> ```bash\n> npm install -g @anthropic-ai/claude-code\n> mkdir agent-lab && cd agent-lab\n> git init\n> claude\n> ```\n> 2. 첫 지시: `이 폴더에 README.md를 만들고 프로젝트 목적을 \"업무 자동화 실습\"으로 적어줘`\n> 3. 에이전트가 파일을 쓰기 전에 **허락을 묻는 장면**을 확인합니다.\n> 성공 확인: README.md가 생기면 성공.\n>\n> 설치 방법은 바뀔 수 있으니 강의 전 [공식 문서](https://docs.claude.com)에서 확인합니다.\n\n## 2. 문제: 매번 규칙을 설명해야 한다 → CLAUDE.md\n\n**CLAUDE.md**는 에이전트가 시작할 때마다 읽는 업무 수첩입니다. 세션에서 `/init`을 실행하면 초안이 생깁니다.\n\n```markdown\n# 프로젝트 규칙\n- 언어: 한국어, 문서는 간결체\n- 산출물은 output/ 폴더에 저장\n- 원본 데이터(data/)는 절대 수정 금지\n- 작업 완료 후 변경 파일 목록을 보고할 것\n\n# 자주 쓰는 명령\n- 테스트: python -m pytest\n```\n\n| 위치 | 적용 범위 | 용도 |\n|---|---|---|\n| `~/.claude/CLAUDE.md` | 내 모든 프로젝트 | 개인 선호 |\n| `./CLAUDE.md` | 이 프로젝트, Git으로 팀 공유 | 팀 규칙 |\n| `./CLAUDE.local.md` | 이 프로젝트, 나만 | 개인 설정 |\n\n> [!example] 생활 속 비유\n> 지니에게 매번 \"우리 부서는 이렇게 일해\"라고 설명하는 대신, 램프에 업무 수첩을 붙여 둡니다.\n\n## 3. 문제: 위험한 일까지 한다 → 권한 설정\n\n`.claude/settings.json`에 허용·차단 명령을 적어 팀이 공유합니다.\n\n```json\n{\n  \"permissions\": {\n    \"allow\": [\"Read\", \"Bash(python:*)\", \"Bash(git status)\"],\n    \"deny\": [\"Bash(rm -rf:*)\", \"Read(./.env)\"]\n  }\n}\n```\n\n**협업 원칙**: 사람은 목표 설정과 검토, 에이전트는 실행과 초안. 에이전트 작업은 Git 브랜치에서 하고 사람이 확인한 뒤 합칩니다.\n\n## 4. 문제: 결과가 엉뚱하다 → 지시 설계 4요소\n\n| 요소 | 나쁜 예 | 좋은 예 |\n|---|---|---|\n| 목표 | 보고서 만들어줘 | 월별 집행률 보고서 1쪽 |\n| 맥락 | (없음) | data/budget.xlsx, 과장 결재용 |\n| 제약 | (없음) | 표 1개, 300자 이내, 원본 수정 금지 |\n| 완료 기준 | (없음) | 합계가 원본과 일치하는지 검증 후 보고 |\n\n> [!example] 바로 해 보기: 나쁜 지시와 좋은 지시\n> 1. 실습 폴더에 들어 있는 `data/budget.xlsx`(가짜 예산 5개 항목)를 씁니다.\n> 2. \"보고서 만들어줘\"를 실행하고 결과를 저장합니다.\n> 3. `/clear` 후 위 표의 좋은 예 네 줄을 그대로 실행합니다.\n> 성공 확인: 두 번째 결과가 검증 결과까지 보고하면 성공.\n\n> [!persona-field] 내 상황 예시: 현장 대원\n> - 목표: 이번 달 출동 일지 요약 1쪽\n> - 맥락: data/출동일지.xlsx(가짜), 센터장 보고용\n> - 제약: 표 1개, 개인정보 열은 쓰지 않기, 원본 수정 금지\n> - 완료 기준: 출동 건수 합계가 원본과 같은지 확인 후 보고\n\n> [!persona-admin] 내 상황 예시: 행정·사무\n> - 목표: 세부사업별 집행률 보고서 1쪽\n> - 맥락: data/budget.xlsx, 과장 결재용, 단위 천원\n> - 제약: 표 1개, 본문 300자 이내, 원본 수정 금지\n> - 완료 기준: 예산액·집행액 합계가 원본과 같은지 확인 후 보고\n\n> [!persona-prev] 내 상황 예시: 예방·안전\n> - 목표: 이번 분기 자체점검 미제출 대상 목록\n> - 맥락: data/점검대상.xlsx(가짜), 안내문 발송용\n> - 제약: 대상물 이름과 기한만, 연락처 열은 쓰지 않기\n> - 완료 기준: 전체 대상 수 = 제출 + 미제출인지 확인\n\n> [!persona-general] 내 상황 예시: 처음 배우는 분\n> - 목표: 다음 주 가족 일정표 1장\n> - 맥락: 가족 4명, 평일 저녁과 주말만\n> - 제약: 표 1개, 겹치는 일정은 빨간 글씨 대신 별표\n> - 완료 기준: 빠진 요일이 없는지 확인\n\n## 5. 문제: 큰일을 잘못된 방향으로 진행한다 → 계획 모드\n\n- `Shift+Tab`으로 **계획 모드(Plan mode)** 로 바꾸면 에이전트가 실행 전에 계획만 보여 줍니다.\n- 사람이 계획을 승인한 뒤 실행합니다. 원칙: **되돌리기 어려운 작업일수록 계획부터.**\n\n## 6. 문제: 대화가 길어지면 흐려진다 → 컨텍스트 관리\n\n| 명령 | 기능 | 쓰는 때 |\n|---|---|---|\n| `/clear` | 대화 초기화 | 주제가 바뀔 때 |\n| `/compact` | 대화를 요약해 압축 | 대화가 길어질 때 |\n| `@파일명` | 특정 파일만 지정 | 범위를 좁힐 때 |\n| `/resume` | 이전 세션 이어가기 | 다음 날 이어서 할 때 |\n\n> [!example] 생활 속 비유\n> 컨텍스트는 작업대입니다. 필요한 서류만 올려 두면 실수가 줄어듭니다.\n\n## 정리\n\n### 1분 요약\n\n에이전트는 목표를 받아 일을 끝낸다. CLAUDE.md로 규칙을, settings.json으로 권한을 주고, 목표·맥락·제약·완료 기준으로 지시하고, 큰일은 계획부터, 작업대는 깨끗하게.\n\n### 문제 → 해결책 짝 맞추기\n\n| 문제 | 해결책 |\n|---|---|\n| 답만 주고 일은 안 한다 | 에이전트 (Claude Code) |\n| 매번 규칙 설명 | CLAUDE.md |\n| 위험한 명령 실행 | 권한 설정 (allow / deny) |\n| 엉뚱한 결과 | 지시 4요소 |\n| 잘못된 방향의 대량 작업 | 계획 모드 |\n| 긴 대화로 정확도 저하 | /clear, /compact, @파일 |\n\n### 이 단계에서 쓰는 도구\n\n- Claude Code, Git, 텍스트 편집기\n\n### 셀프 체크\n\n- [ ] 챗봇과 에이전트의 차이를 표로 말할 수 있다\n- [ ] 내 프로젝트용 CLAUDE.md에 규칙 4줄을 썼다\n- [ ] 지시 4요소로 지시문 1개를 썼다\n- [ ] 계획 모드로 바꾸는 키를 안다\n\n### AI에게 더 잘 요청하기\n\n| 막연한 요청 | 용어를 넣은 요청 |\n|---|---|\n| 이 엑셀 정리해줘 | 계획 모드로 먼저 단계만 보여줘. 원본은 수정 금지, 결과는 output/에 |\n| 다 고쳐줘 | 변경할 파일 목록과 이유를 먼저 보고하고, 내가 승인하면 진행해 |\n\n### 더 찾아볼 곳\n\n- [Claude Code 공식 문서](https://docs.claude.com/en/docs/claude-code/overview)\n- [프롬프트 엔지니어링 가이드](https://docs.claude.com/en/docs/build-with-claude/prompt-engineering/overview)\n\n```quiz\n{\"title\":\"4강 확인 퀴즈\",\"questions\":[\n{\"q\":\"에이전트가 챗봇과 다른 점으로 옳은 것은?\",\"options\":[\"질문에 한 번만 답한다\",\"계획하고 도구를 실행하며 결과를 확인한다\",\"텍스트만 만든다\",\"도구를 쓸 수 없다\"],\"answer\":1,\"explain\":\"목표→계획→도구 호출→관찰→수정→완료의 루프를 돕니다.\"},\n{\"q\":\"팀이 Git으로 함께 쓰는 프로젝트 규칙 파일의 위치는?\",\"options\":[\"~/.claude/CLAUDE.md\",\"./CLAUDE.md\",\"./CLAUDE.local.md\",\"./README.md\"],\"answer\":1,\"explain\":\"프로젝트 루트의 CLAUDE.md가 팀 규칙입니다.\"},\n{\"q\":\"지시 4요소가 아닌 것은?\",\"options\":[\"목표\",\"맥락\",\"완료 기준\",\"말투의 공손함\"],\"answer\":3,\"explain\":\"목표·맥락·제약·완료 기준이 4요소입니다.\"},\n{\"q\":\"되돌리기 어려운 작업 전에 쓰면 좋은 기능은?\",\"options\":[\"계획 모드\",\"/resume\",\"@파일명\",\"/init\"],\"answer\":0,\"explain\":\"실행 전에 계획을 보고 승인합니다.\"},\n{\"q\":\"대화가 길어졌을 때 요약해서 압축하는 명령은?\",\"options\":[\"/clear\",\"/compact\",\"/agents\",\"/mcp\"],\"answer\":1,\"explain\":\"/clear는 초기화, /compact는 요약 압축입니다.\"}\n]}\n```\n"}, {"id": "p05", "file": "AIAX_05_MCP스킬훅.md", "title": "5강 · MCP·스킬·훅으로 자동화하기", "navTitle": "5강. MCP·스킬·훅", "part": "본강", "order": 5.0, "time": "25분", "md": "---\ntitle: 5강 · MCP·스킬·훅으로 자동화하기\npart: 본강\norder: 5\ntime: 25분\ndesc: MCP로 자료를 연결하고, 스킬로 반복 업무를 묶고, 훅으로 실수를 막는 법을 직접 만들어 봅니다.\npractice: 70%\nnav: 5강. MCP·스킬·훅\ntags: [MCP, 스킬, 훅, ClaudeCode, 자동화]\n---\n\n# 5강. MCP·스킬·훅으로 자동화하기\n\n![[images/aiax_ig_05_tools.png|MCP는 손발, 스킬은 업무 수첩, 훅은 꼭 지키는 약속]]\n\n> [!question] 생각해 보기\n> 신규 직원이 업무 수첩(4강)을 받았습니다. 그래도 공유폴더에 접근을 못 하고, 매주 하는 보고서 양식을 모르고, 원본 서류를 실수로 버릴 수 있습니다. 무엇을 더 줘야 할까요?\n\n## 0. 한 줄 흐름\n\n```mermaid\ngraph LR\n    A[\"밖의 자료에 손이 안 닿는다\"] --> B[\"MCP<br/>손과 발\"]\n    B --> C[\"반복 업무를 매번 설명한다\"] --> D[\"스킬<br/>업무 매뉴얼\"]\n    D --> E[\"지켜야 할 규칙을 잊는다\"] --> F[\"훅<br/>강제 규칙\"]\n```\n\n| 장치 | 비유 | 역할 | 누가 실행하나 |\n|---|---|---|---|\n| MCP | 손과 발 | 외부 도구·데이터 연결 | 에이전트가 필요할 때 호출 |\n| 스킬 | 업무 매뉴얼 | 반복 업무 절차 묶음 | 에이전트가 상황을 보고 꺼내 씀 |\n| 훅 | 자동 규칙 | 특정 시점에 무조건 실행 | 시스템이 강제 실행 |\n\n## 1. 문제: 밖의 자료에 손이 안 닿는다 → MCP\n\n> [!abstract] 약어 풀이\n> MCP: Model Context Protocol. 에이전트가 파일, 드라이브, 메신저, DB 같은 외부 도구에 같은 방식으로 연결되는 표준 규격. USB 단자처럼 꽂으면 연결됩니다.\n\n> [!example] 바로 해 보기: 파일 MCP 연결\n> 1. 터미널에서 아래를 입력합니다.\n> ```bash\n> claude mcp add filesystem -- npx -y @modelcontextprotocol/server-filesystem ./data\n> claude mcp list\n> ```\n> 2. Claude Code 세션에서 `/mcp`를 입력해 연결 상태를 봅니다.\n> 3. \"data 폴더 파일 목록 보여줘\"라고 지시합니다.\n> 성공 확인: 연결 상태가 connected이고 파일 목록이 나오면 성공.\n\n팀이 함께 쓰려면 프로젝트에 `.mcp.json`으로 남깁니다.\n\n```json\n{\n  \"mcpServers\": {\n    \"filesystem\": {\n      \"command\": \"npx\",\n      \"args\": [\"-y\", \"@modelcontextprotocol/server-filesystem\", \"./data\"]\n    }\n  }\n}\n```\n\n구글 드라이브, 슬랙, 노션, DB도 같은 방식으로 연결합니다.\n\n## 2. 문제: 반복 업무를 매번 설명한다 → 스킬\n\n`.claude/skills/weekly-report/SKILL.md`\n\n```markdown\n---\nname: weekly-report\ndescription: 주간 업무보고서 작성 요청 시 사용. data/ 엑셀을 읽어 output/에 보고서 md를 만든다.\n---\n\n# 주간 업무보고 작성 절차\n1. data/ 폴더의 최신 엑셀을 읽는다\n2. 항목별 건수와 전주 대비 증감을 계산한다\n3. output/주간보고_YYYYMMDD.md로 저장한다\n   - 제목 / 주요 실적(3줄) / 수치 표 / 다음 주 계획\n4. 표 합계가 원본과 일치하는지 검증하고 결과를 보고한다\n```\n\n> [!tip] 핵심\n> `description`이 \"언제 이 스킬을 꺼낼지\"를 정합니다. 어떤 요청에 쓰는지 구체적으로 씁니다.\n\n> [!example] 바로 해 보기: 스킬 호출\n> 1. 위 파일을 그대로 만듭니다.\n> 2. 새 세션에서 \"이번 주 주간보고 만들어줘\"라고만 지시합니다.\n> 성공 확인: 에이전트가 weekly-report 스킬을 불러와 양식대로 output/에 저장하면 성공.\n\n## 3. 문제: 지켜야 할 규칙을 잊는다 → 훅\n\n훅(Hook)은 정해진 시점에 무조건 실행됩니다. 에이전트가 \"깜빡\"할 수 없습니다.\n\n| 이벤트 | 시점 | 쓰임 |\n|---|---|---|\n| PreToolUse | 도구 실행 전 | 위험 명령 차단 (종료 코드 2) |\n| PostToolUse | 도구 실행 후 | 변경 기록, 서식 정리 |\n| UserPromptSubmit | 지시 입력 시 | 규칙 자동 주입 |\n| Stop | 작업 종료 시 | 테스트 실행, 알림 |\n\n**예시: 원본 폴더 삭제·이동 차단 + 변경 기록**\n\n`.claude/hooks/protect-data.sh`\n\n```bash\n#!/bin/bash\n# 표준입력으로 받은 도구 정보에서 명령어를 꺼낸다\ncmd=$(jq -r '.tool_input.command // \"\"')\nif echo \"$cmd\" | grep -q 'data/' && echo \"$cmd\" | grep -qE '(^|[[:space:]])(rm|mv)[[:space:]]'; then\n  echo \"data/ 원본은 삭제·이동할 수 없습니다\" >&2\n  exit 2\nfi\nexit 0\n```\n\n`.claude/settings.json`\n\n```json\n{\n  \"hooks\": {\n    \"PreToolUse\": [\n      { \"matcher\": \"Bash\",\n        \"hooks\": [ { \"type\": \"command\", \"command\": \"bash .claude/hooks/protect-data.sh\" } ] }\n    ],\n    \"PostToolUse\": [\n      { \"matcher\": \"Edit|Write\",\n        \"hooks\": [ { \"type\": \"command\",\n          \"command\": \"jq -r '.tool_input.file_path' >> output/change.log\" } ] }\n    ]\n  }\n}\n```\n\n> [!example] 바로 해 보기: 훅이 막는지 확인\n> 1. `chmod +x .claude/hooks/protect-data.sh` 후 세션을 다시 시작합니다.\n> 2. \"data 폴더의 엑셀을 지워줘\"라고 지시합니다.\n> 3. 아무 파일이나 수정을 지시한 뒤 `output/change.log`를 엽니다.\n> 성공 확인: 삭제가 막히고, change.log에 수정한 파일 경로가 남으면 성공.\n\n> [!warning] 강사 메모\n> 훅은 강제 실행되므로 잘못 쓰면 모든 작업이 막힙니다. 강의 전 실습 환경에서 위 두 훅을 직접 돌려 보고 시연합니다. `jq` 설치가 필요합니다.\n\n## 정리\n\n### 1분 요약\n\nMCP는 손발(외부 연결), 스킬은 업무 매뉴얼(반복 절차), 훅은 강제 규칙(무조건 실행). 매번 설명하던 것을 파일로 남기면 에이전트가 같은 품질로 반복합니다.\n\n### 문제 → 해결책 짝 맞추기\n\n| 문제 | 해결책 |\n|---|---|\n| 외부 자료·도구에 닿지 않는다 | MCP |\n| 반복 업무를 매번 설명한다 | 스킬 (SKILL.md) |\n| 규칙을 잊거나 어긴다 | 훅 (PreToolUse 차단, PostToolUse 기록) |\n| 스킬이 안 불린다 | description을 구체적으로 |\n\n### 이 단계에서 쓰는 도구\n\n- `claude mcp add`, `/mcp`, `.mcp.json`\n- `.claude/skills/<이름>/SKILL.md`\n- `.claude/settings.json`의 hooks, jq\n\n### 셀프 체크\n\n- [ ] MCP·스킬·훅을 비유로 구분해 말할 수 있다\n- [ ] MCP 서버 1개를 연결했다\n- [ ] 내 업무용 SKILL.md 초안 1개를 썼다\n- [ ] 훅이 실제로 차단하는 것을 확인했다\n\n### AI에게 더 잘 요청하기\n\n| 막연한 요청 | 용어를 넣은 요청 |\n|---|---|\n| 이거 자동으로 해줘 | 이 절차를 SKILL.md로 만들어줘. description은 \"출동통계 월보 요청 시 사용\" |\n| 실수 안 하게 해줘 | data/ 삭제를 막는 PreToolUse 훅을 만들고, 테스트 방법도 알려줘 |\n\n### 더 찾아볼 곳\n\n- [Model Context Protocol 공식 사이트](https://modelcontextprotocol.io)\n- [Claude Code 훅 문서](https://docs.claude.com/en/docs/claude-code/hooks)\n- [Claude Code 스킬 문서](https://docs.claude.com/en/docs/claude-code/skills)\n\n```quiz\n{\"title\":\"5강 확인 퀴즈\",\"questions\":[\n{\"q\":\"에이전트를 외부 도구·데이터에 연결하는 표준 규격은?\",\"options\":[\"MCP\",\"SKILL.md\",\"CLAUDE.md\",\"PreToolUse\"],\"answer\":0,\"explain\":\"MCP는 Model Context Protocol입니다.\"},\n{\"q\":\"스킬이 언제 쓰일지를 결정하는 항목은?\",\"options\":[\"name\",\"description\",\"파일 크기\",\"폴더 색\"],\"answer\":1,\"explain\":\"description을 보고 에이전트가 스킬을 꺼냅니다.\"},\n{\"q\":\"에이전트의 판단과 상관없이 정해진 시점에 무조건 실행되는 것은?\",\"options\":[\"스킬\",\"MCP\",\"훅\",\"서브에이전트\"],\"answer\":2,\"explain\":\"훅은 시스템이 강제로 실행합니다.\"},\n{\"q\":\"위험한 명령을 실행 전에 막으려면 어떤 이벤트를 쓰나?\",\"options\":[\"PostToolUse\",\"PreToolUse\",\"Stop\",\"UserPromptSubmit\"],\"answer\":1,\"explain\":\"PreToolUse에서 종료 코드 2를 돌려주면 차단됩니다.\"},\n{\"q\":\"MCP·스킬·훅의 비유로 바른 짝은?\",\"options\":[\"손발·매뉴얼·강제 규칙\",\"매뉴얼·손발·강제 규칙\",\"강제 규칙·손발·매뉴얼\",\"손발·강제 규칙·매뉴얼\"],\"answer\":0,\"explain\":\"MCP는 손발, 스킬은 매뉴얼, 훅은 강제 규칙입니다.\"}\n]}\n```\n"}, {"id": "p06", "file": "AIAX_06_멀티에이전트와업무자동화.md", "title": "6강 · 멀티에이전트와 업무 자동화 데모", "navTitle": "6강. 멀티에이전트·업무 자동화", "part": "본강", "order": 6.0, "time": "25분", "md": "---\ntitle: 6강 · 멀티에이전트와 업무 자동화 데모\npart: 본강\norder: 6\ntime: 25분\ndesc: 계산·작성·검토 에이전트를 나눠 지시 한 번으로 보고서를 끝내고, 자동화할 업무를 고르는 기준을 익힙니다.\npractice: 60%\nnav: 6강. 멀티에이전트·업무 자동화\ntags: [멀티에이전트, 서브에이전트, 워크플로우, 업무자동화]\n---\n\n# 6강. 멀티에이전트와 업무 자동화 데모\n\n![[images/aiax_ig_06_team.png|쓴 지니와 검사하는 지니는 따로]]\n\n> [!question] 생각해 보기\n> 보고서를 쓴 사람이 자기 보고서를 검토하면 오류를 잘 찾을까요? 결재 라인에 검토자가 따로 있는 이유는 무엇일까요?\n\n## 0. 한 줄 흐름\n\n```mermaid\ngraph LR\n    A[\"혼자 다 하면<br/>작업대가 넘친다\"] --> B[\"역할 분리<br/>서브에이전트\"]\n    B --> C[\"자기가 쓴 걸<br/>자기가 검토한다\"] --> D[\"작성자·검토자 분리\"]\n    D --> E[\"여러 일을<br/>하나로 잇는다\"] --> F[\"파이프라인<br/>최종 데모\"]\n    F --> G[\"무엇을 맡길까\"] --> H[\"자동화 대상<br/>4가지 기준\"]\n```\n\n## 1. 문제: 혼자 다 하면 작업대가 넘친다 → 멀티에이전트\n\n| 단일 에이전트 | 멀티에이전트 |\n|---|---|\n| 컨텍스트 하나에 모든 작업 누적 | 역할별 독립 컨텍스트 |\n| 자기가 만든 걸 자기가 검토 | 작성자와 검토자 분리 |\n| 순서대로 처리 | 동시에 처리 가능 |\n\n**대표 패턴 세 가지**\n\n1. **순차형(파이프라인)**: 수집 → 분석 → 작성 → 검토\n2. **병렬형(팬아웃)**: 여러 파일·주제를 동시에 처리한 뒤 모음\n3. **검토형(평가자)**: 작성 에이전트 + 독립 검토 에이전트\n\n> [!example] 생활 속 비유\n> 지니 한 명에게 다 시키지 않고, 계산 담당 지니와 검토 담당 지니를 따로 둡니다. 결재 라인과 같습니다.\n\n## 2. 해결: 역할이 다른 서브에이전트 만들기\n\n`.claude/agents/analyst.md`\n\n```markdown\n---\nname: analyst\ndescription: 엑셀·CSV 데이터 분석 전담. 수치 계산과 표 작성이 필요할 때 사용.\ntools: Read, Bash, Write\n---\n너는 데이터 분석가다. 계산은 반드시 파이썬으로 실행해 검증하고,\n결과는 output/analysis.md에 표로 저장한다. 해석은 하지 않는다.\n```\n\n`.claude/agents/reviewer.md`\n\n```markdown\n---\nname: reviewer\ndescription: 산출물 검토 전담. 보고서 완성 후 수치·형식 오류 확인 시 사용.\ntools: Read, Bash\n---\n너는 검토자다. 원본 데이터와 보고서 수치를 대조하고\n오류 목록만 보고한다. 파일을 직접 수정하지 않는다.\n```\n\n> [!tip] 설계 원칙\n> - 역할은 하나, 도구는 최소로\n> - **검토자에게는 쓰기 권한을 주지 않는다** (tools에 Write·Edit 없음)\n> - `/agents` 명령으로 목록 확인과 생성도 할 수 있다\n\n## 3. 해결: 하나의 지시로 파이프라인 돌리기 (최종 데모)\n\n```mermaid\ngraph TD\n    D[\"data/weekly_stats.xlsx\"] -->|MCP 파일 접근| A[\"analyst<br/>수치 계산·표\"]\n    A --> S[\"weekly-report 스킬<br/>양식대로 작성\"]\n    S -->|훅: change.log 기록| R[\"reviewer<br/>원본 대조 검증\"]\n    R -->|오류 있으면| S\n    R -->|이상 없음| O[\"output/주간보고_YYYYMMDD.md\"]\n```\n\n메인 에이전트에게 한 번에 지시합니다.\n\n```\n1) analyst 서브에이전트로 data/weekly_stats.xlsx를 분석하고\n2) weekly-report 스킬로 보고서를 작성한 뒤\n3) reviewer 서브에이전트로 검토해서\n오류가 있으면 고친 최종본을 output/에 저장해줘\n```\n\n> [!example] 바로 해 보기: 오류 잡는 장면 보기\n> 1. 실습 폴더의 `data/weekly_stats.xlsx`에는 마센터 합계가 일부러 틀려 있습니다(30, 정답 27).\n> 2. 위 지시를 실행합니다.\n> 3. reviewer의 오류 보고, 수정된 최종본, `output/change.log`의 훅 기록을 차례로 엽니다.\n> 성공 확인: 검토자가 틀린 행을 찾아내고 최종본에서 고쳐졌으면 성공.\n\n**심화(선택)**: `git worktree add ../agent-lab-b -b feature-b`로 작업 폴더를 나눠 에이전트 두 개를 동시에 돌립니다.\n\n## 4. 문제: 무엇을 맡길까 → 자동화 대상 4가지 기준\n\n| 기준 | 질문 | 맡겨도 됨 |\n|---|---|---|\n| 반복성 | 주 1회 이상 하는가 | 예 |\n| 규칙성 | 절차를 문장으로 쓸 수 있는가 | 예 |\n| 검증성 | 결과가 맞는지 확인할 수 있는가 | 예 |\n| 복구성 | 실수해도 되돌릴 수 있는가 | 예 |\n\n네 가지가 모두 \"예\"인 업무부터 시작합니다. 하나라도 \"아니오\"면 사람이 최종 판단합니다.\n\n> [!example] 바로 해 보기: 내 업무 고르기\n> 1. 이번 주 내가 한 일 5개를 적습니다.\n> 2. 위 4가지 기준으로 O·X를 표시합니다.\n> 3. 네 개 모두 O인 업무 1개로 SKILL.md 초안을 5줄로 씁니다.\n> 성공 확인: 1~2명이 발표할 수 있으면 성공. 활용편에서 이어 갑니다.\n\n> [!persona-field] 현장 대원이라면 이런 일부터\n> 매일 아침 장비 점검표 취합 (반복 O, 규칙 O, 검증 O, 복구 O) → 스킬 1개로 시작\n\n> [!persona-admin] 행정·사무라면 이런 일부터\n> 매월 지출집행현황 엑셀로 집행률 보고 (반복 O, 규칙 O, 검증 O, 복구 O) → 분석·작성·검토 파이프라인\n\n> [!persona-prev] 예방·안전이라면 이런 일부터\n> 자체점검 결과 접수 목록 정리 (반복 O, 규칙 O, 검증 O, 복구 O) → 스킬 1개로 시작. 위반 판정은 사람이 합니다\n\n> [!persona-general] 처음 배우는 분이라면 이런 일부터\n> 매주 하는 가계부 정리 (반복 O, 규칙 O, 검증 O, 복구 O) → 대화형 AI에 같은 지시문을 저장해 두고 반복\n\n## 정리\n\n### 1분 요약\n\n역할을 나누고 검토자는 따로 둔다(쓰기 권한 없이). MCP·스킬·훅·서브에이전트를 이으면 지시 한 줄로 분석 → 작성 → 검토가 끝난다. 반복·규칙·검증·복구 가능한 일부터 맡긴다.\n\n### 문제 → 해결책 짝 맞추기\n\n| 문제 | 해결책 |\n|---|---|\n| 한 작업대에 모든 일이 쌓인다 | 서브에이전트로 역할 분리 |\n| 자기 검토로 오류를 못 찾는다 | 쓰기 권한 없는 reviewer |\n| 단계마다 사람이 지시한다 | 파이프라인 지시 한 번 |\n| 무엇부터 자동화할지 모른다 | 반복·규칙·검증·복구 4기준 |\n\n### 이 단계에서 쓰는 도구\n\n- `.claude/agents/*.md`, `/agents`, git worktree\n\n### 셀프 체크\n\n- [ ] 멀티에이전트 패턴 세 가지를 말할 수 있다\n- [ ] 검토자에게 쓰기 권한을 주지 않는 이유를 말할 수 있다\n- [ ] 최종 데모의 흐름을 그림 없이 설명할 수 있다\n- [ ] 내 업무 1개를 4기준으로 판정했다\n\n### AI에게 더 잘 요청하기\n\n| 막연한 요청 | 용어를 넣은 요청 |\n|---|---|\n| 검토도 해줘 | 읽기 전용 reviewer 서브에이전트로 원본과 수치를 대조하고 오류 목록만 보고해 |\n| 이 일 자동화해줘 | 이 업무가 반복·규칙·검증·복구 기준을 통과하는지 먼저 판정하고, 통과하면 스킬 초안을 써줘 |\n\n### 더 찾아볼 곳\n\n- [Claude Code 서브에이전트 문서](https://docs.claude.com/en/docs/claude-code/sub-agents)\n- [Anthropic: Building effective agents](https://www.anthropic.com/research/building-effective-agents)\n\n```quiz\n{\"title\":\"6강 확인 퀴즈\",\"questions\":[\n{\"q\":\"멀티에이전트의 장점이 아닌 것은?\",\"options\":[\"역할별 독립 컨텍스트\",\"작성자와 검토자 분리\",\"병렬 처리\",\"검토 없이 바로 확정\"],\"answer\":3,\"explain\":\"멀티에이전트는 오히려 검토를 분리해 강화합니다.\"},\n{\"q\":\"reviewer 서브에이전트의 tools에서 빼야 하는 것은?\",\"options\":[\"Read\",\"Bash\",\"Write\",\"모두 필요\"],\"answer\":2,\"explain\":\"검토자는 고치지 않고 보고만 해야 합니다.\"},\n{\"q\":\"수집→분석→작성→검토 순서로 잇는 패턴은?\",\"options\":[\"순차형(파이프라인)\",\"병렬형(팬아웃)\",\"검토형(평가자)\",\"단일형\"],\"answer\":0,\"explain\":\"단계를 차례로 잇는 것이 파이프라인입니다.\"},\n{\"q\":\"자동화 대상 4가지 기준이 아닌 것은?\",\"options\":[\"반복성\",\"규칙성\",\"검증성\",\"화려함\"],\"answer\":3,\"explain\":\"반복성·규칙성·검증성·복구성입니다.\"},\n{\"q\":\"최종 데모에서 오류를 일부러 1건 넣는 이유는?\",\"options\":[\"파일 크기를 키우려고\",\"검토자가 오류를 잡는 장면을 보여주려고\",\"속도를 높이려고\",\"훅을 끄려고\"],\"answer\":1,\"explain\":\"작성자·검토자 분리의 효과를 눈으로 확인합니다.\"}\n]}\n```\n"}, {"id": "p90", "file": "AIAX_90_복습.md", "title": "복습 · 1~6강 한 장 정리", "navTitle": "복습. 한 장 정리", "part": "복습", "order": 90.0, "time": "10분", "md": "---\ntitle: 복습 · 1~6강 한 장 정리\npart: 복습\norder: 90\ntime: 10분\ndesc: 1~6강을 한 장으로 다시 보고, 자주 하는 오해를 바로잡습니다.\npractice: 30%\nnav: 복습. 한 장 정리\ntags: [복습]\n---\n\n# 복습. 1~6강 한 장 정리\n\n## 1. 한 장 요약표\n\n| 강 | 핵심 질문 | 한 줄 답 | 지니 비유 |\n|---|---|---|---|\n| 1강 | AI는 어디서 왔나 | 튜링 질문 → 두 번의 겨울 → 딥러닝 → 말하는 AI | 지니의 탄생 |\n| 2강 | 어떻게 말하고 무엇을 경계하나 | 리터러시로 의심하고, 프롬프트로 정확히 | 소원 비는 법 |\n| 3강 | 지금 어디까지 왔나 | 말하는 → 보고 듣는 → 생각하는 → 일하는 AI | 지니의 세대교체 |\n| 4강 | 일을 맡기려면 무엇을 준비하나 | CLAUDE.md, 권한, 지시 4요소, 계획 모드 | 업무 수첩 |\n| 5강 | 손발·매뉴얼·규칙은 | MCP·스킬·훅 | 손발·매뉴얼·강제 규칙 |\n| 6강 | 일 하나를 끝까지 끝내려면 | 역할 분리 + 검토자 분리 + 파이프라인 | 지니 팀 |\n\n```mermaid\ngraph LR\n    A[\"이해<br/>1~3강\"] --> B[\"준비<br/>4강\"]\n    B --> C[\"확장<br/>5강\"]\n    C --> D[\"협업<br/>6강\"]\n    D --> E[\"적용<br/>활용편\"]\n```\n\n## 2. 전 강의 짝 맞추기\n\n| 문제 | 해결책 | 강 |\n|---|---|---|\n| 규칙을 다 적을 수 없다 | 머신러닝 | 1 |\n| 긴 문장의 맥락을 놓친다 | 트랜스포머 | 1 |\n| AI가 그럴듯하게 틀린다 | 리터러시 | 2 |\n| 원하는 답이 안 나온다 | 프롬프트, 컨텍스트 엔지니어링 | 2 |\n| 바로 답해서 틀린다 | 추론 모델 | 3 |\n| 대답만 하고 일은 못 한다 | 에이전트 | 3, 4 |\n| 매번 규칙을 설명한다 | CLAUDE.md | 4 |\n| 엉뚱한 결과 | 지시 4요소 (목표·맥락·제약·완료 기준) | 4 |\n| 외부 자료에 손이 안 닿는다 | MCP | 5 |\n| 반복 업무를 매번 설명한다 | 스킬 | 5 |\n| 규칙을 어긴다 | 훅 | 5 |\n| 자기 검토로 오류를 못 찾는다 | 쓰기 권한 없는 검토 에이전트 | 6 |\n\n## 3. 오해 바로잡기\n\n| 오해 | 바로잡기 |\n|---|---|\n| AI는 최근에 갑자기 생겼다 | 1956년에 이름이 붙었고, 70년 동안 겨울과 봄을 반복했다 |\n| 프롬프트 요령만 알면 된다 | 요령은 금방 낡는다. 남는 것은 판단력과 자료를 주는 능력 |\n| 최신 모델 이름을 외워야 한다 | 매달 바뀐다. \"몇 막인가\"로 위치만 잡는다 |\n| 에이전트는 알아서 다 해 준다 | 규칙(CLAUDE.md)·권한·완료 기준을 줘야 제대로 한다 |\n| 스킬과 훅은 같은 것이다 | 스킬은 에이전트가 골라 쓰고, 훅은 시스템이 무조건 실행한다 |\n| 검토도 같은 에이전트가 하면 된다 | 작성자와 검토자를 나눠야 오류를 잡는다 |\n| 아무 업무나 자동화하면 된다 | 반복·규칙·검증·복구 4기준을 통과한 업무부터 |\n\n## 4. 셀프 체크\n\n- [ ] AI의 겨울이 온 이유를 말할 수 있다\n- [ ] 리터러시와 격차의 관계를 말할 수 있다\n- [ ] 2022~2026년 4막을 순서대로 말할 수 있다\n- [ ] 지시 4요소로 지시문을 쓸 수 있다\n- [ ] MCP·스킬·훅을 비유로 구분할 수 있다\n- [ ] 검토자에게 쓰기 권한을 주지 않는 이유를 안다\n- [ ] 자동화 대상 4기준을 말할 수 있다\n\n> [!tip] 다음\n> [[AIAX_95_활용편|활용편]]에서 내 업무 하나를 골라 실제로 맡길 설계도를 만듭니다.\n"}, {"id": "p95", "file": "AIAX_95_활용편.md", "title": "활용편 · 이제 무엇을 맡길까", "navTitle": "활용편. 이제 무엇을 맡길까", "part": "활용편", "order": 95.0, "time": "30분", "md": "---\ntitle: 활용편 · 이제 무엇을 맡길까\npart: 활용편\norder: 95\ntime: 30분\ndesc: 내 업무를 신호등으로 판정하고, 설계기로 AI에게 보낼 요청문까지 만들어 갑니다.\npractice: 60%\nnav: 활용편. 이제 무엇을 맡길까\ntags: [활용편, AX, 업무자동화, 아이디어]\n---\n\n# 활용편. 이제 무엇을 맡길까\n\n![[images/aiax_ig_95_apply.png|질문 두 개로 빨강·노랑·초록을 고릅니다]]\n\n> [!question] 생각해 보기\n> 지난 한 달 동안 \"이건 매번 똑같은데 누가 대신 해 주면 좋겠다\"라고 생각한 일이 있었나요? 하나만 떠올려 두세요. 이 시간이 끝나면 그 일을 AI에게 맡길 설계도 한 장이 손에 남습니다.\n\n## 0. 한 줄 흐름\n\n```mermaid\ngraph LR\n    A[\"불편 하나\"] --> B[\"맡겨도 되나?<br/>4기준·보안\"]\n    B --> C[\"어느 수준으로?<br/>대화·스킬·파이프라인\"]\n    C --> D[\"설계도 1장\"]\n    D --> E[\"첫 버전\"]\n    E --> F[\"동료 피드백\"]\n    F --> G[\"공유·개선\"]\n    G --> A\n```\n\n1~6강에서 배운 것은 외우는 지식이 아니라 **\"이 일을 AI에게 맡겨도 되는가, 어느 수준으로 맡길까\"를 재는 자**입니다.\n\n## 1. 배운 것은 어디에 쓰이나\n\n| 배운 것 | 강의 속 비유 | 업무에서의 쓰임 | 소방 업무 예시 |\n|---|---|---|---|\n| 리터러시 (2강) | 거짓 소원 알아채기 | AI 답의 사실 확인 | 법령 조문·수치가 맞는지 원문 대조 |\n| 프롬프트 4요소 (4강) | 소원을 정확히 | 한 번에 쓸 만한 초안 | 화재 예방 홍보문, 안전교육 대본 |\n| CLAUDE.md (4강) | 업무 수첩 | 부서 규칙을 매번 안 말해도 됨 | 공문 서식·용어 규칙 고정 |\n| MCP (5강) | 손발 | 공유폴더·드라이브 자료 읽기 | 점검 결과 엑셀을 바로 읽어 집계 |\n| 스킬 (5강) | 업무 매뉴얼 | 반복 문서를 같은 양식으로 | 주간 출동통계 보고, 구입 품의 초안 |\n| 훅 (5강) | 강제 규칙 | 실수 방지 | 원본 대장 삭제·덮어쓰기 차단 |\n| 검토 에이전트 (6강) | 결재 라인 | 수치·형식 오류 잡기 | 예산 집행률 보고서 합계 검증 |\n\n> [!tip] 핵심\n> 대부분의 업무는 **가장 단순한 방법(대화형 AI + 좋은 지시)으로 충분합니다.** 스킬은 같은 일을 주 1회 이상 할 때, 파이프라인은 여러 단계를 매번 이어서 할 때만 씁니다. 단순할수록 빨리 만들고 보안 걱정도 줄어듭니다.\n\n## 2. 내 상황은 어디에 해당하나\n\n```mermaid\ngraph TD\n    Q0{\"개인정보·비공개<br/>자료가 들어가나?\"} -->|예| X[\"외부 AI에 넣지 않는다<br/>가명처리·내부 승인 먼저\"]\n    Q0 -->|아니오| Q1{\"결과를 사람이<br/>검증할 수 있나?\"}\n    Q1 -->|아니오| H[\"사람이 판단<br/>AI는 참고 자료만\"]\n    Q1 -->|예| Q2{\"주 1회 이상<br/>같은 절차로 하나?\"}\n    Q2 -->|아니오| L1[\"수준 1: 대화형 AI<br/>지시 4요소로 한 번\"]\n    Q2 -->|예| Q3{\"여러 단계·여러 파일을<br/>매번 잇나?\"}\n    Q3 -->|아니오| L2[\"수준 2: 스킬 1개<br/>+ CLAUDE.md\"]\n    Q3 -->|예| L3[\"수준 3: 파이프라인<br/>MCP·스킬·훅·검토 에이전트\"]\n```\n\n기억할 질문 세 개:\n\n1. **넣어도 되나?** 개인정보·비공개 자료가 있으면 멈춘다.\n2. **확인할 수 있나?** 결과를 검증할 수 없으면 사람이 판단한다.\n3. **얼마나 자주, 몇 단계인가?** 가끔이면 대화, 자주면 스킬, 자주+여러 단계면 파이프라인.\n\n> [!example] 바로 해 보기: 판별 연습\n> 아래 세 업무는 각각 어느 수준일까요?\n> - (가) 다음 달 한 번 있는 소방안전 캠페인 홍보 문구 작성\n> - (나) 매주 월요일 출동 통계 엑셀로 주간 보고서 작성\n> - (다) 매월 지출집행현황 엑셀 → 세부사업별 집행률 계산 → 보고서 → 합계 검증\n>\n> 정답: (가) 수준 1 대화형 AI · (나) 수준 2 스킬 · (다) 수준 3 파이프라인(분석·작성·검토 분리)\n\n> [!persona-field] 현장 대원의 첫 과제 예시\n> 출동 후 장비 점검 체크리스트 만들기 → 초록불, 수준 1(대화형 AI). 실제 차량번호·대원 이름은 넣지 않습니다.\n\n> [!persona-admin] 행정·사무의 첫 과제 예시\n> 월간 집행률 보고서 → 초록불, 수준 3(분석·작성·검토). 예산 엑셀은 금액을 바꾼 가짜 파일로 먼저 시험합니다.\n\n> [!persona-prev] 예방·안전의 첫 과제 예시\n> 자체점검 안내문 대상별 문구 만들기 → 초록불, 수준 2(스킬). 대상물 주소·관계인 이름은 넣지 않습니다.\n\n> [!persona-general] 처음 배우는 분의 첫 과제 예시\n> 우리 집 화재 대피 계획 → 초록불, 수준 1(대화형 AI). 결과를 가족과 함께 소리 내어 읽어 보며 확인합니다.\n\n## 3. 아이디어가 생기면: 실행 단계\n\n| 단계 | 할 일 | 산출물 | 시간 |\n|---|---|---|---|\n| 1 불편 적기 | 반복되는 일, 실수 나는 일, 남에게 묻는 일을 적는다 | 메모 3줄 | 5분 |\n| 2 한 문장 정의 | \"누가 / 무엇을 넣으면 / 무엇이 나온다\" | 문장 1개 | 5분 |\n| 3 판정 | 위 흐름도로 수준 1·2·3 중 하나를 정한다 | 수준 표시 | 2분 |\n| 4 계획 1장 | 입력, 출력, 절차, 완료 기준, 금지 사항을 적는다 | 설계도 1장 | 20분 |\n| 5 실행 | 수준에 맞게 지시문·SKILL.md·에이전트를 만든다 | 첫 버전 | 30분 |\n| 6 동료 피드백 | 옆자리 1명에게 써 보게 하고 막힌 곳을 적는다 | 고칠 목록 | 15분 |\n| 7 공유·개선 | 부서에 공유하고 받은 의견으로 고친다 | v2, v3 | 반복 |\n\n> [!warning] 시작하기 전에 꼭 확인\n> - **실제 개인정보·내부 문서는 외부 AI에 넣지 않는다.** 가짜 예시 데이터로 만들고, 실데이터는 기관 보안 정책을 따른다.\n> - 부서 공용으로 쓰려면 **상급자와 정보보안 담당자에게 먼저 보고·승인**을 받는다.\n> - 비밀번호·API 키를 CLAUDE.md나 코드에 적지 않는다.\n> - 업무 중 만든 도구는 **직무발명**에 해당할 수 있다. 특허를 생각한다면 공개 전에 기관 절차를 확인한다.\n> - AI 결과물은 초안이다. 결재·대외 발송 전 최종 확인은 사람이 한다.\n\n## 4. 아이디어 설계기\n\n빈칸을 채우면 신호등과 수준을 판정하고, 설계도와 AI에게 보낼 요청문을 만들어 줍니다. 결과를 복사해 Claude에 그대로 붙여 넣으세요.\n\n```idea-lab\n{\"examples\":[\n {\"name\":\"안전교육 대본 생성\",\"who\":\"119안전센터 안전교육 담당자\",\"pain\":\"대상(유치원·노인·학생)이 바뀔 때마다 교육 대본을 처음부터 다시 쓴다\",\"input\":\"교육 대상, 시간, 주제\",\"output\":\"대상 눈높이에 맞춘 교육 대본과 확인 질문 3개\",\"secret\":\"no\",\"verify\":\"yes\",\"freq\":\"often\",\"steps\":\"one\"},\n {\"name\":\"월간 집행률 보고\",\"who\":\"소방서 예산 담당자\",\"pain\":\"매달 지출집행현황 엑셀을 손으로 집계하고 합계를 다시 맞춘다\",\"input\":\"지출집행현황 엑셀(가짜 데이터로 시험)\",\"output\":\"세부사업별 집행률 표와 보고서 초안, 합계 검증 결과\",\"secret\":\"no\",\"verify\":\"yes\",\"freq\":\"weekly\",\"steps\":\"many\"}\n]}\n```\n\n## 5. 더 잘 요청하기·실행하기\n\n| 막연한 시작 | 배운 것을 넣은 시작 |\n|---|---|\n| AI로 업무 자동화해 보고 싶어 | 이 업무가 반복·규칙·검증·복구 4기준을 통과하는지 먼저 판정해줘 |\n| 보고서 자동으로 만들어줘 | 목표: 월간 집행률 1쪽 / 맥락: 가짜 예시 엑셀 / 제약: 표 1개, 원본 수정 금지 / 완료 기준: 합계 검증 결과 보고 |\n| 매번 같은 걸 시키기 귀찮아 | 이 절차를 SKILL.md로 만들어줘. description은 \"월간 집행률 보고 요청 시 사용\" |\n| 틀릴까 봐 걱정돼 | 쓰기 권한 없는 reviewer 서브에이전트로 원본과 대조해 오류 목록만 보고해 |\n| 실수로 원본 지울까 봐 | data/ 삭제·이동을 막는 PreToolUse 훅과 테스트 방법을 만들어줘 |\n\n## 6. 다음 학습 경로\n\n```mermaid\ngraph LR\n    S1[\"1단계<br/>대화형 AI 매일 쓰기\"] --> S2[\"2단계<br/>CLAUDE.md + 스킬 1개\"]\n    S2 --> S3[\"3단계<br/>MCP 연결 + 훅\"]\n    S3 --> S4[\"4단계<br/>검토 에이전트·파이프라인\"]\n```\n\n| 단계 | 목표 | 첫 과제 | 연결 강의 |\n|---|---|---|---|\n| 1 | AI 답을 의심하며 쓰기 | 업무 질문 하루 3개, 답 1개씩 원문 대조 | [[AIAX_02_AI핵심용어\\|2강]] |\n| 2 | 반복 문서 하나 고정 | 내 업무용 CLAUDE.md + SKILL.md 1개 | [[AIAX_04_에이전트환경과지시설계\\|4강]], [[AIAX_05_MCP스킬훅\\|5강]] |\n| 3 | 자료 연결과 실수 방지 | 파일 MCP 연결, 원본 보호 훅 | [[AIAX_05_MCP스킬훅\\|5강]] |\n| 4 | 끝까지 맡기기 | 분석·작성·검토 3단 파이프라인 1개 | [[AIAX_06_멀티에이전트와업무자동화\\|6강]] |\n\n## 7. 정리\n\n### 1분 요약\n\n먼저 \"넣어도 되나, 확인할 수 있나\"를 묻고, 가끔 하는 일은 대화형 AI로, 자주 하는 일은 스킬로, 여러 단계를 매번 잇는 일만 파이프라인으로. 대부분은 가장 단순한 방법으로 충분하다.\n\n### 셀프 체크\n\n- [ ] 내 업무 1개를 흐름도로 판정했다\n- [ ] 한 문장 정의(\"누가 / 무엇을 넣으면 / 무엇이 나온다\")를 썼다\n- [ ] 설계기로 설계도와 요청문을 만들었다\n- [ ] 개인정보·보안·보고 절차를 확인했다\n\n> [!todo] 오늘의 과제\n> 이번 주 안에 판정한 업무 1개를 가짜 예시 데이터로 실제 AI에게 맡겨 첫 버전을 만들고, 동료 1명에게 보여 줍니다.\n\n```quiz\n{\"title\":\"활용편 확인 퀴즈\",\"questions\":[\n{\"q\":\"AI에게 업무를 맡기기 전 가장 먼저 확인할 것은?\",\"options\":[\"가장 최신 모델인지\",\"개인정보·비공개 자료가 들어가는지\",\"화면이 예쁜지\",\"작업 속도\"],\"answer\":1,\"explain\":\"넣으면 안 되는 자료인지가 첫 관문입니다.\"},\n{\"q\":\"다음 달 한 번 있는 캠페인 문구 작성은 어느 수준이 알맞나?\",\"options\":[\"수준 1 대화형 AI\",\"수준 2 스킬\",\"수준 3 파이프라인\",\"자동화 불가\"],\"answer\":0,\"explain\":\"한 번 하는 일은 좋은 지시 한 번으로 충분합니다.\"},\n{\"q\":\"매주 같은 절차로 만드는 단일 보고서에 알맞은 것은?\",\"options\":[\"매번 새로 설명\",\"스킬 1개 + CLAUDE.md\",\"멀티에이전트 5개\",\"훅만 설정\"],\"answer\":1,\"explain\":\"반복되지만 단계가 단순하면 스킬이 맞습니다.\"},\n{\"q\":\"결과를 사람이 검증할 방법이 없는 업무는?\",\"options\":[\"무조건 파이프라인으로\",\"사람이 판단하고 AI는 참고만\",\"스킬로 고정\",\"훅으로 차단\"],\"answer\":1,\"explain\":\"검증 불가능한 결과를 그대로 쓰면 위험합니다.\"},\n{\"q\":\"업무 중 만든 도구를 외부에 공개하기 전 확인할 것은?\",\"options\":[\"색상\",\"직무발명 해당 여부와 기관 절차\",\"파일 이름 길이\",\"폰트\"],\"answer\":1,\"explain\":\"직무발명과 보고·승인 절차를 먼저 확인합니다.\"}\n]}\n```\n"}, {"id": "p97", "file": "AIAX_97_실습키트.md", "title": "부록 · 실습 키트 (복사해서 바로 쓰기)", "navTitle": "부록. 실습 키트", "part": "부록", "order": 97.0, "time": "실습용", "md": "---\ntitle: 부록 · 실습 키트 (복사해서 바로 쓰기)\npart: 부록\norder: 97\ntime: 실습용\ndesc: 강의에 나온 지시문과 소스를 순서대로 모았습니다. 상자마다 복사 버튼이 있습니다.\nnav: 부록. 실습 키트\ntags: [실습, 프롬프트, ClaudeCode, 복사]\n---\n\n# 부록. 실습 키트 (복사해서 바로 쓰기)\n\n강의 중 나온 모든 지시문(프롬프트)과 소스를 순서대로 모았습니다. 회색 상자마다 **복사** 버튼이 있습니다. 옵시디언에서는 상자 오른쪽 위 복사 아이콘을 누릅니다.\n\n> [!tip] 실습 폴더 받기\n> 함께 받은 `agent-lab.zip`을 풀면 아래 4~6강 파일(CLAUDE.md, 설정, 훅, 스킬, 서브에이전트, 가짜 데이터)이 모두 들어 있습니다. 압축을 풀었다면 0단계의 \"파일 직접 만들기\"는 건너뜁니다.\n\n> [!warning] 실습 안내\n> 모든 데이터는 가짜입니다. 실제 개인정보·내부 문서는 넣지 않습니다.\n\n## 1. 대화형 AI 실습 (1~3강, 설치 불필요)\n\nClaude, ChatGPT, Gemini 중 아무 서비스에서 합니다.\n\n### 1강. AI 역사 사실 확인\n\n```text\nAI의 겨울이 왜 왔는지 소방관에게 비유해서 3줄로 설명해줘. 연도와 인물이 나오면 함께 적어줘.\n```\n\n답에 나온 연도·인물을 1강 표와 대조합니다.\n\n### 2강. 같은 일, 두 가지 소원\n\n먼저 막연한 요청:\n\n```text\n소방 안전교육 자료 만들어줘\n```\n\n새 대화에서 구체적인 요청:\n\n```text\n초등 3학년 대상, 10분짜리 화재 대피 안전교육 대본을 써줘. 아이에게 던질 질문 2개를 포함하고, 쉬운 말로 써줘.\n```\n\n### 2강. 사실 확인 요청\n\n```text\n방금 답에서 사실 확인이 필요한 문장만 골라 표로 정리하고, 확인할 수 있는 공식 출처를 함께 적어줘.\n```\n\n### 3강. 내가 쓰는 모델 확인\n\n```text\n너는 어떤 회사의 어떤 모델이야? 출시 시기와 함께 알려주고, 모르면 모른다고 답해줘.\n```\n\n## 2. 에이전트 실습 준비 (4강)\n\n### 0단계. 설치와 실습 폴더 만들기\n\n터미널(맥: 터미널, 윈도우: Git Bash 권장)에 입력합니다. 설치 방법은 바뀔 수 있으니 [공식 문서](https://docs.claude.com/en/docs/claude-code/overview)를 먼저 확인합니다.\n\n```bash\nnpm install -g @anthropic-ai/claude-code\n```\n\nzip을 쓰지 않는 경우 실습 폴더를 직접 만듭니다.\n\n```bash\nmkdir agent-lab && cd agent-lab\ngit init\nmkdir -p data output .claude/hooks .claude/skills/weekly-report .claude/agents\n```\n\n가짜 데이터 만들기 (파이썬 필요). 아래 내용을 `make_sample_data.py`로 저장합니다.\n\n```python\n# 실습용 가짜 데이터 생성기 (실제 개인정보·내부 자료 아님)\n# 실행: python make_sample_data.py   (필요: pip install openpyxl)\nfrom openpyxl import Workbook\n\ndef save(path, header, rows):\n    wb = Workbook(); ws = wb.active; ws.title = \"Sheet1\"\n    ws.append(header)\n    for r in rows: ws.append(r)\n    wb.save(path)\n\n# 1) 주간 출동 실적 (6강 데모용) - 마지막 열 '합계'에 일부러 틀린 값 1개\nrows = [\n    [\"가센터\", 3, 5, 21, 29],\n    [\"나센터\", 2, 4, 18, 24],\n    [\"다센터\", 1, 7, 25, 33],\n    [\"라센터\", 4, 3, 15, 22],   # 정답 22\n    [\"마센터\", 2, 6, 19, 30],   # 오류: 정답은 27\n]\nsave(\"data/weekly_stats.xlsx\", [\"센터\", \"화재\", \"구조\", \"구급\", \"합계\"], rows)\n\n# 2) 예산 집행 현황 (4강 지시 비교용)\nbudget = [\n    [\"소방장비 유지관리\", 50000, 32000],\n    [\"청사 시설관리\", 80000, 61000],\n    [\"안전교육 운영\", 12000, 9000],\n    [\"의용소방대 지원\", 30000, 15000],\n    [\"119생활안전\", 20000, 17500],\n]\nsave(\"data/budget.xlsx\", [\"세부사업\", \"예산액(천원)\", \"집행액(천원)\"], budget)\nprint(\"data/weekly_stats.xlsx, data/budget.xlsx 생성 완료\")\n```\n\n```bash\npip install openpyxl\npython make_sample_data.py\n```\n\n### 1단계. 에이전트 실행과 첫 지시\n\n```bash\nclaude\n```\n\n```text\n이 폴더에 README.md를 만들고 프로젝트 목적을 \"업무 자동화 실습\"으로 적어줘\n```\n\n### 2단계. CLAUDE.md (업무 수첩)\n\n세션에서 `/init`을 실행하거나, 아래 내용을 `CLAUDE.md`로 저장합니다.\n\n```markdown\n# 프로젝트 규칙\n- 언어: 한국어, 문서는 간결체\n- 산출물은 output/ 폴더에 저장\n- 원본 데이터(data/)는 절대 수정 금지\n- 작업 완료 후 변경 파일 목록을 보고할 것\n\n# 자주 쓰는 명령\n- 데이터 다시 만들기: python make_sample_data.py\n```\n\n### 3단계. 나쁜 지시와 좋은 지시 비교\n\n나쁜 지시:\n\n```text\n보고서 만들어줘\n```\n\n`/clear`로 대화를 비운 뒤 좋은 지시:\n\n```text\n목표: data/budget.xlsx로 세부사업별 집행률 보고서 1쪽을 만들어줘.\n맥락: 과장 결재용이고 금액 단위는 천원이야.\n제약: 표 1개, 본문 300자 이내, 원본(data/)은 수정 금지, 결과는 output/에 저장.\n완료 기준: 표의 예산액·집행액 합계가 원본과 일치하는지 파이썬으로 검증하고 결과를 보고해.\n```\n\n### 4단계. 계획 모드\n\n`Shift+Tab`으로 계획 모드로 바꾼 뒤:\n\n```text\ndata 폴더의 엑셀 두 개를 하나의 요약 보고서로 합치려고 해. 실행하지 말고 단계별 계획만 보여줘.\n```\n\n## 3. MCP·스킬·훅 (5강)\n\n### MCP 연결\n\n```bash\nclaude mcp add filesystem -- npx -y @modelcontextprotocol/server-filesystem ./data\nclaude mcp list\n```\n\n세션 안에서 `/mcp`로 상태를 본 뒤:\n\n```text\ndata 폴더 파일 목록과 각 파일의 첫 줄(제목 행)을 보여줘\n```\n\n팀 공유용 `.mcp.json`:\n\n```json\n{\n  \"mcpServers\": {\n    \"filesystem\": {\n      \"command\": \"npx\",\n      \"args\": [\"-y\", \"@modelcontextprotocol/server-filesystem\", \"./data\"]\n    }\n  }\n}\n```\n\n### 스킬 만들기\n\n`.claude/skills/weekly-report/SKILL.md`로 저장:\n\n```markdown\n---\nname: weekly-report\ndescription: 주간 업무보고서(주간 출동 실적 보고) 작성 요청 시 사용. data/ 엑셀을 읽어 output/에 보고서 md를 만든다.\n---\n\n# 주간 업무보고 작성 절차\n1. data/ 폴더의 최신 엑셀을 읽는다\n2. 항목별 건수와 합계를 계산한다\n3. output/주간보고_YYYYMMDD.md로 저장한다\n   - 제목 / 주요 실적(3줄) / 수치 표 / 다음 주 계획\n4. 표 합계가 원본과 일치하는지 검증하고 결과를 보고한다\n```\n\n새 세션에서 스킬 호출 확인:\n\n```text\n이번 주 주간보고 만들어줘\n```\n\n### 훅 만들기\n\n`.claude/hooks/protect-data.sh`로 저장:\n\n```bash\n#!/bin/bash\n# 표준입력으로 받은 도구 정보에서 명령어를 꺼낸다\ncmd=$(jq -r '.tool_input.command // \"\"')\nif echo \"$cmd\" | grep -q 'data/' && echo \"$cmd\" | grep -qE '(^|[[:space:]])(rm|mv)[[:space:]]'; then\n  echo \"data/ 원본은 삭제·이동할 수 없습니다\" >&2\n  exit 2\nfi\nexit 0\n```\n\n`.claude/settings.json`으로 저장 (권한 + 훅):\n\n```json\n{\n  \"permissions\": {\n    \"allow\": [\"Read\", \"Bash(python:*)\", \"Bash(git status)\"],\n    \"deny\": [\"Bash(rm -rf:*)\", \"Read(./.env)\"]\n  },\n  \"hooks\": {\n    \"PreToolUse\": [\n      { \"matcher\": \"Bash\",\n        \"hooks\": [ { \"type\": \"command\", \"command\": \"bash .claude/hooks/protect-data.sh\" } ] }\n    ],\n    \"PostToolUse\": [\n      { \"matcher\": \"Edit|Write\",\n        \"hooks\": [ { \"type\": \"command\",\n          \"command\": \"jq -r '.tool_input.file_path' >> output/change.log\" } ] }\n    ]\n  }\n}\n```\n\n훅 스크립트를 실행 가능하게 하고, 에이전트 없이 먼저 직접 시험합니다 (jq 설치 필요).\n\n```bash\nchmod +x .claude/hooks/protect-data.sh\necho '{\"tool_input\":{\"command\":\"rm data/budget.xlsx\"}}' | bash .claude/hooks/protect-data.sh; echo \"exit=$?\"\necho '{\"tool_input\":{\"command\":\"ls data/\"}}' | bash .claude/hooks/protect-data.sh; echo \"exit=$?\"\n```\n\n첫 줄은 `exit=2`(차단), 둘째 줄은 `exit=0`(통과)이 나오면 정상입니다. 세션을 다시 시작한 뒤 에이전트에게 시험합니다.\n\n```text\ndata 폴더의 budget.xlsx를 지워줘\n```\n\n```text\noutput 폴더에 test.md를 만들고 \"훅 테스트\"라고 적어줘\n```\n\n`output/change.log`에 test.md 경로가 남으면 성공입니다.\n\n## 4. 멀티에이전트 데모 (6강)\n\n`.claude/agents/analyst.md`:\n\n```markdown\n---\nname: analyst\ndescription: 엑셀·CSV 데이터 분석 전담. 수치 계산과 표 작성이 필요할 때 사용.\ntools: Read, Bash, Write\n---\n너는 데이터 분석가다. 계산은 반드시 파이썬으로 실행해 검증하고,\n결과는 output/analysis.md에 표로 저장한다. 해석은 하지 않는다.\n```\n\n`.claude/agents/reviewer.md`:\n\n```markdown\n---\nname: reviewer\ndescription: 산출물 검토 전담. 보고서 완성 후 수치·형식 오류 확인 시 사용.\ntools: Read, Bash\n---\n너는 검토자다. 원본 데이터와 보고서 수치를 대조하고\n오류 목록만 보고한다. 파일을 직접 수정하지 않는다.\n```\n\n세션에서 `/agents`로 두 에이전트가 보이는지 확인한 뒤 한 번에 지시합니다.\n\n```text\n1) analyst 서브에이전트로 data/weekly_stats.xlsx를 분석하고\n2) weekly-report 스킬로 보고서를 작성한 뒤\n3) reviewer 서브에이전트로 검토해서\n오류가 있으면 고친 최종본을 output/에 저장해줘\n```\n\n성공 확인: reviewer가 \"마센터 합계 30, 계산값 27\" 오류를 보고하고, 최종본에는 27로 고쳐져 있으면 성공입니다.\n\n심화(선택) - 작업 폴더를 나눠 에이전트 두 개를 동시에:\n\n```bash\ngit worktree add ../agent-lab-b -b feature-b\n```\n\n## 5. 활용편 지시문\n\n판정 요청:\n\n```text\n아래 업무가 AI에게 맡길 만한지 판정해줘.\n기준: 1) 개인정보·비공개 자료가 들어가는가 2) 결과를 사람이 검증할 수 있는가 3) 주 1회 이상 같은 절차로 하는가 4) 여러 단계·여러 파일을 매번 잇는가\n결과를 수준 1(대화형 AI), 수준 2(스킬), 수준 3(파이프라인) 중 하나로 답하고 이유를 3줄로 써줘.\n업무: (여기에 내 업무를 한 문장으로)\n```\n\n스킬 초안 요청:\n\n```text\n아래 업무 절차를 Claude Code 스킬(SKILL.md)로 만들어줘.\ndescription은 \"○○ 요청 시 사용\"처럼 언제 쓰는지 구체적으로 쓰고, 마지막 단계에는 결과 검증을 넣어줘.\n절차: (여기에 내 업무 순서를 번호로)\n```\n\n검토 에이전트 요청:\n\n```text\n읽기 전용 reviewer 서브에이전트를 만들어줘. tools는 Read와 Bash만 주고, 원본과 결과를 대조해 오류 목록만 보고하게 해줘.\n```\n\n원본 보호 훅 요청:\n\n```text\ndata/ 폴더의 파일을 삭제·이동하려 하면 막는 PreToolUse 훅을 만들고, 에이전트 없이 직접 시험하는 명령도 알려줘.\n```\n"}, {"id": "p99", "file": "AIAX_99_약어사전.md", "title": "부록 · 약어 사전", "navTitle": "부록. 약어 사전", "part": "부록", "order": 99.0, "time": "참고용", "md": "---\ntitle: 부록 · 약어 사전\npart: 부록\norder: 99\ntime: 참고용\ndesc: 강의에 나온 약어의 원어와 쉬운 뜻입니다.\nnav: 부록. 약어 사전\ntags: [약어, 용어, 부록]\n---\n\n# 부록. 약어 사전\n\n강의에 나온 약어를 분야별로 모았습니다. \"나온 곳\"은 처음 또는 주로 나오는 강입니다.\n\n## 1. AI 일반\n\n| 약어 | 원어 | 쉬운 뜻 | 나온 곳 |\n|---|---|---|---|\n| AI | Artificial Intelligence | 인공지능. 사람처럼 배우고 판단하는 기계 | 1강 |\n| AGI | Artificial General Intelligence | 범용 인공지능. 사람처럼 거의 모든 일을 하는 AI (아직 없음) | 2강 특이점 참고 |\n| AX | AI Transformation | AI 전환. AI로 일하는 방식 자체를 바꾸는 것 | 안내, 활용편 |\n| DX | Digital Transformation | 디지털 전환. AX의 앞 단계 | 참고 |\n| GPU | Graphics Processing Unit | 그래픽 처리 장치. AI 학습에 쓰는 계산 장치 | 1강 |\n| LLM | Large Language Model | 거대언어모델. 많은 글로 \"다음 말\"을 맞히며 배운 AI | 1강, 3강 |\n| ML | Machine Learning | 머신러닝. 자료를 보고 스스로 규칙을 찾는 방식 | 1강 |\n| DL | Deep Learning | 딥러닝. 신경망을 여러 층 쌓아 배우는 방식 | 1강 |\n\n## 2. 모델·서비스 이름 속 약어\n\n| 약어 | 원어 | 쉬운 뜻 | 나온 곳 |\n|---|---|---|---|\n| GPT | Generative Pre-trained Transformer | 미리 학습한 생성형 트랜스포머. OpenAI 모델 이름 | 1강, 3강 |\n| GPT-4o의 o | omni | \"모든 것\". 글·그림·소리를 함께 다룬다는 뜻 | 3강 |\n| LLaMA | Large Language Model Meta AI | Meta의 공개 언어모델 | 3강 |\n| xAI | (회사 이름) | 일론 머스크가 세운 AI 회사. Grok 개발 | 3강 |\n| 독파모 | 독자 AI 파운데이션 모델 | 정부의 국가대표 AI 모델 사업 | 3강 |\n| UI | User Interface | 사용자 화면. GPT-6의 Intelligent UI | 3강 |\n\n## 3. 에이전트·개발\n\n| 약어 | 원어 | 쉬운 뜻 | 나온 곳 |\n|---|---|---|---|\n| MCP | Model Context Protocol | 에이전트를 외부 도구·데이터에 연결하는 표준 규격 | 5강 |\n| API | Application Programming Interface | 프로그램끼리 주고받는 창구. API 키는 그 출입증 | 활용편 |\n| CLI | Command Line Interface | 글자로 명령을 입력하는 화면(터미널). Claude Code가 동작하는 곳 | 4강 |\n| npm | Node Package Manager | Node.js 프로그램 설치 도구 | 4강 |\n| npx | (npm package executor) | 설치 없이 바로 실행하는 명령 | 5강 |\n| JSON | JavaScript Object Notation | 설정을 적는 텍스트 형식. settings.json, .mcp.json | 4강, 5강 |\n| md | Markdown | 마크다운. 기호로 제목·표를 적는 문서 형식. CLAUDE.md, SKILL.md | 4강, 5강 |\n| jq | (명령 이름) | JSON에서 원하는 값만 꺼내는 도구. 훅 예시에 사용 | 5강 |\n| rm / mv | remove / move | 삭제 / 이동 명령. 훅으로 막는 대상 | 5강 |\n| DB | Database | 데이터베이스. 기록을 모아 두는 저장소 | 5강 |\n\n## 4. 파일·데이터\n\n| 약어 | 원어 | 쉬운 뜻 | 나온 곳 |\n|---|---|---|---|\n| CSV | Comma-Separated Values | 쉼표로 칸을 나눈 표 파일 | 6강 |\n| xlsx | Excel 통합문서 | 엑셀 파일 형식 | 4강, 6강 |\n| PNG | Portable Network Graphics | 그림 파일 형식. 연표 그림 | 3강 |\n| PDF | Portable Document Format | 어디서나 같은 모양으로 보이는 문서 형식 | 참고 |\n\n> [!tip] 약어를 AI에게 물을 때\n> \"MCP가 뭐야?\"보다 \"MCP를 소방서 공유폴더 예시로, 비전공자에게 3줄로 설명해줘\"처럼 대상과 예시를 붙이면 바로 쓸 수 있는 설명이 나옵니다.\n"}]}</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script>
(function(){
const DATA = JSON.parse(document.getElementById('course-data').textContent);
const C = DATA.course || {}, DOCS = DATA.docs || [];
const PART_ORDER = ['안내','본강','복습','활용편','부록'];
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const store = {get(k){try{return JSON.parse(localStorage.getItem('aiax:'+k))}catch(e){return null}}, set(k,v){try{localStorage.setItem('aiax:'+k,JSON.stringify(v))}catch(e){}}};
const ICON_HAND = '<svg viewBox="0 0 16 16" fill="currentColor"><path d="M5 14.5 3 9.6a1 1 0 0 1 1.7-1L6 10V3.2a1 1 0 0 1 2 0V7h.2V2.4a1 1 0 0 1 2 0V7h.2V3.4a1 1 0 0 1 2 0V7h.1V5a1 1 0 0 1 2 0v5.5c0 2.5-1.8 4-4 4z"/></svg>';
const ICON_CHECK = '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8.5l3 3 7-7"/></svg>';
const PERSONAS = [
  {k:'field', n:'현장 대원', s:'화재·구조·구급'},
  {k:'admin', n:'행정·사무', s:'예산·계약·문서'},
  {k:'prev', n:'예방·안전', s:'점검·인허가·홍보'},
  {k:'general', n:'처음 배우는 분', s:'AI를 처음 써 보는 분'}
];
function toast(msg){ const t = $('#toast'); t.textContent = msg; t.hidden = false; clearTimeout(toast.h); toast.h = setTimeout(() => t.hidden = true, 2600); }

/* ---------- course meta ---------- */
DOCS.sort((a,b) => (PART_ORDER.indexOf(a.part) - PART_ORDER.indexOf(b.part)) || (a.order - b.order));
let mainN = 0, apx = 0;
DOCS.forEach(d => {
  const fm = {}; const m = d.md.match(/^---\n([\s\S]*?)\n---\n/);
  if (m) m[1].split('\n').forEach(l => { const i = l.indexOf(':'); if (i > 0) fm[l.slice(0,i).trim()] = l.slice(i+1).trim(); });
  d.desc = fm.desc || ''; d.practice = fm.practice || '';
  d.min = d.part === '안내' ? (parseInt(fm.slot,10) || 5) : (parseInt(d.time, 10) || 0);
  d.hasPractice = /바로 해 보기/.test(d.md) || d.part === '부록' && /실습/.test(d.title);
  d.short = (d.navTitle || d.title).replace(/^(\d+강|복습|활용편|부록)\.\s*/, '');
  if (d.part === '안내') d.no = '0';
  else if (d.part === '부록') d.no = String.fromCharCode(65 + apx++);
  else d.no = String(++mainN);
  d.plain = d.md.replace(/^---\n[\s\S]*?\n---\n/, '').replace(/```[\s\S]*?```/g,' ').replace(/[#>*|`\[\]!-]/g,' ').replace(/\s+/g,' ');
});
const progMin = DOCS.filter(d => d.part !== '안내' && d.part !== '부록').reduce((s,d) => s + d.min, 0);
const introMin = DOCS.filter(d => d.part === '안내').reduce((s,d) => s + d.min, 0);
function startAt(){ return store.get('start') || C.start || '09:00'; }
function slots(){
  let [h, m] = startAt().split(':').map(Number); let t = h*60 + m; const out = {};
  const f = x => String(Math.floor(x/60)%24).padStart(2,'0') + ':' + String(x%60).padStart(2,'0');
  DOCS.forEach(d => { if (d.part === '부록' || !d.min) return; out[d.id] = f(t) + '~' + f(t + d.min); t += d.min; });
  return out;
}
$('#ctitle').textContent = C.title || '';
function setSub(){ $('#csub').textContent = `교재 · 강의 시작 ${startAt()} · 전체 ${Math.floor((progMin+introMin)/60)}시간 ${(progMin+introMin)%60}분`; }
setSub();

/* ---------- markdown ---------- */
const stripFront = md => md.replace(/^---\n[\s\S]*?\n---\n/, '');
function tildes(md){
  let fence = false;
  return md.split('\n').map(l => {
    if (/^\s*(```|~~~)/.test(l)){ fence = !fence; return l; }
    if (fence) return l;
    return l.split(/(`[^`]*`)/).map((part, i) => i % 2 ? part : part.replace(/(?<![~\\])~(?!~)/g, '\\~')).join('');
  }).join('\n');
}
function wiki(md){
  md = tildes(md);
  md = md.replace(/!\[\[([^\]|]+\.(?:png|jpe?g|svg|gif|webp))(?:\|([^\]]*))?\]\]/gi, (m, src, cap) => `![${(cap && !/^\d+(x\d+)?$/.test(cap)) ? cap.replace(/[\[\]]/g,'') : ''}](${src.trim()})`);
  return md.replace(/\[\[([^\]|]+)(?:\|([^\]]+))?\]\]/g, (m, target, label) => {
    const d = DOCS.find(x => x.file && x.file.replace(/\.md$/,'') === target.trim());
    const text = label || target.replace(/^.*?_\d+_/, '').replace(/_/g,' ');
    return d ? `[${text}](#${d.id})` : `**${text}**`;
  });
}
let blockId = 0; const BLOCKS = {};
function callouts(md){
  const lines = md.split('\n'), out = [];
  for (let i=0;i<lines.length;i++){
    const m = lines[i].match(/^>\s*\[!([\w-]+)\]\s*(.*)$/);
    if (!m){ out.push(lines[i]); continue; }
    const body = [];
    while (i+1 < lines.length && /^>/.test(lines[i+1])) body.push(lines[++i].replace(/^>\s?/, ''));
    const key = 'CO' + (blockId++);
    BLOCKS[key] = {type:'callout', kind:m[1].toLowerCase(), title:m[2], md:body.join('\n')};
    out.push('', `<div data-block="${key}"></div>`, '');
  }
  return out.join('\n');
}
const renderer = new marked.Renderer();
renderer.code = function(code, lang){
  if (typeof code === 'object'){ lang = code.lang; code = code.text; }
  lang = (lang||'').trim();
  if (lang === 'mermaid') return `<div class="mm" data-src="${esc(code)}"></div>`;
  if (lang === 'quiz' || lang === 'idea-lab'){ const key = 'B' + (blockId++); BLOCKS[key] = {type:lang, raw:code}; return `<div data-block="${key}"></div>`; }
  return `<div class="code">${lang?`<span class="lang">${esc(lang)}</span>`:''}<button type="button" class="tb cp" aria-label="코드 복사">복사</button><pre><code>${esc(code)}</code></pre></div>`;
};
renderer.table = function(h, b){
  if (typeof h === 'object' && h.header) return '<div class="tbl">' + marked.Renderer.prototype.table.call(this, h) + '</div>';
  return `<div class="tbl"><table><thead>${h}</thead><tbody>${b}</tbody></table></div>`;
};
marked.setOptions({renderer, gfm:true, breaks:false});
const mdToHtml = md => marked.parse(callouts(wiki(md)));

let mmReady = null, mmN = 0;
function loadMermaid(){
  if (mmReady) return mmReady;
  mmReady = new Promise((res, rej) => { const s = document.createElement('script'); s.src = 'https://cdnjs.cloudflare.com/ajax/libs/mermaid/10.9.1/mermaid.min.js'; s.onload = () => res(window.mermaid); s.onerror = rej; document.head.appendChild(s); });
  return mmReady;
}
function isDark(){ const t = document.documentElement.getAttribute('data-theme'); return t ? t === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches; }
async function drawMermaid(root){
  const boxes = root.querySelectorAll('.mm'); if (!boxes.length) return;
  try{
    const mm = await loadMermaid();
    mm.initialize({startOnLoad:false, theme: isDark() ? 'dark' : 'neutral', fontFamily:'IBM Plex Sans KR, Malgun Gothic, sans-serif', securityLevel:'strict'});
    for (const b of boxes){ try{ const {svg} = await mm.render('mm' + (mmN++), b.dataset.src); b.innerHTML = svg; b.classList.remove('err'); } catch(e){ b.classList.add('err'); b.textContent = b.dataset.src; } }
  }catch(e){ boxes.forEach(b => { b.classList.add('err'); b.textContent = b.dataset.src; }); }
}

/* ---------- persona ---------- */
function persona(){ return store.get('persona'); }
function applyPersona(){
  const p = persona(), P = PERSONAS.find(x => x.k === p);
  if (p) document.body.dataset.persona = p; else delete document.body.dataset.persona;
  $('#meName').textContent = P ? P.n : '고르지 않음';
  document.querySelectorAll('.callout.persona').forEach(c => c.classList.toggle('match', c.dataset.p === p));
  document.querySelectorAll('.picker button').forEach(b => b.classList.toggle('on', b.dataset.p === p));
}
function pickerHTML(){ return PERSONAS.map(x => `<button type="button" data-p="${x.k}">${esc(x.n)}<small>${esc(x.s)}</small></button>`).join(''); }
document.addEventListener('click', e => {
  const b = e.target.closest('.picker button'); if (!b) return;
  store.set('persona', b.dataset.p); applyPersona(); $('#mePop').hidden = true; $('#meBtn').setAttribute('aria-expanded','false');
  toast(`내 상황: ${PERSONAS.find(x => x.k === b.dataset.p).n}. 예시가 바뀌었습니다.`);
});
$('#mePick').innerHTML = pickerHTML();

/* ---------- blocks ---------- */
function mountBlocks(root, doc){
  root.querySelectorAll('[data-block]').forEach(el => {
    const B = BLOCKS[el.dataset.block]; if (!B) return;
    if (B.type === 'callout'){
      const div = document.createElement('div');
      const per = B.kind.match(/^persona-(\w+)$/);
      if (B.kind === 'persona-pick'){
        div.className = 'callout question';

function makeQuiz(raw){

  Q.questions.forEach((it, qi) => {
    const d = document.createElement('div'); d.className = 'qi';
    d.innerHTML = `<div class="qq">${qi+1}. ${esc(it.q)}</div><div class="opts"></div><div class="ex" hidden></div>`;

        opts.querySelectorAll('button').forEach((x, xi) => { x.disabled = true; if (xi === it.answer) x.classList.add('right'); });
        if (oi !== it.answer) b.classList.add('wrong'); else right++;

/* split article into cards with badges */
function cardify(art){
  const nodes = [...art.childNodes]; art.innerHTML = '';
  const cards = []; let cur = null;
  const open = (h2) => { cur = {h: h2, nodes: []}; cards.push(cur); };
  open(null);
  nodes.forEach(n => {
    if (n.nodeType === 1 && n.tagName === 'H1') return;
    if (n.nodeType === 1 && n.tagName === 'H2') open(n); else cur.nodes.push(n);
  });
  const quizzes = [];
  const out = [];
  cards.forEach((c, i) => {
    const sec = document.createElement('section'); sec.className = 'card slidable'; sec.id = 's' + i;
    const body = document.createElement('div'); c.nodes.forEach(n => body.appendChild(n));
    body.querySelectorAll('.quiz').forEach(q => { quizzes.push(q); q.remove(); });
    if (!c.h && !body.textContent.trim() && !body.querySelector('img,.mm')) return;
    const title = c.h ? c.h.textContent : (body.querySelector('.callout.question') ? '생각해 보기' : '시작');
    let kind = ['설명',''];
    if (!c.h) kind = ['시작','b-start'];
    else if (/정리|요약|셀프 체크/.test(title)) kind = ['정리','b-sum'];
    else if (body.querySelector('.callout.prac, .lab') || /실습|바로|따라|설계기/.test(title)) kind = ['실습','b-prac'];
    else if (body.querySelector('.mm') && body.children.length <= 3) kind = ['흐름',''];
    sec.innerHTML = `<div class="card-h"><span class="badge ${kind[1]}">${kind[0]}</span><h2>${esc(title)}</h2></div>`;
    sec.dataset.toc = title.replace(/^\d+\.\s*/, '');
    sec.appendChild(body); out.push(sec);
  });
  quizzes.forEach((q, i) => {
    const sec = document.createElement('section'); sec.className = 'card slidable'; sec.id = 'sq' + i;
    sec.innerHTML = `<div class="card-h"><span class="badge b-quiz">퀴즈</span><h2>${esc(q.dataset.title)}</h2></div>`;
    sec.dataset.toc = q.dataset.title; sec.appendChild(q); out.push(sec);
  });
  out.forEach(s => art.appendChild(s));
  return out;
}

$('#sExit').onclick = () => setSlideMode(false);
function step(dir){
  const L = slideList();
  if (slideI + dir >= L.length){ const nx = DOCS[DOCS.indexOf(CUR)+1]; if (nx) location.hash = nx.id; return; }
  if (slideI + dir < 0){ const pv = DOCS[DOCS.indexOf(CUR)-1]; if (pv) location.hash = pv.id; return; }
  setSlide(slideI + dir);
}
$('#sPrev').onclick = () => step(-1); $('#sNext').onclick = () => step(1);
document.addEventListener('keydown', e => {
  if (!document.body.classList.contains('slide') || e.target.closest('input,textarea,select')) return;
  if (e.key === 'ArrowRight' || e.key === 'PageDown' || e.key === ' '){ e.preventDefault(); step(1); }
  if (e.key === 'ArrowLeft' || e.key === 'PageUp'){ e.preventDefault(); step(-1); }
});

/* ---------- timer ---------- */
const T = {total: 10*60, left: 10*60, end: 0, run: false, h: 0};
const fmt = s => String(Math.floor(s/60)).padStart(2,'0') + ':' + String(Math.floor(s%60)).padStart(2,'0');
function tPaint(){
  const done = T.left <= 0;
  $('#tDisp').textContent = fmt(Math.max(0, T.left)); $('#bigV').textContent = done ? '끝' : fmt(Math.max(0, T.left));
  $('#bigM').textContent = done ? '시간이 다 됐어요' : (T.run ? '진행 중' : '멈춤');
  $('#bigT').classList.toggle('done', done);
  const active = T.run || (T.left < T.total);
  $('#tLabel').textContent = active ? fmt(Math.max(0, T.left)) : '타이머';
  $('#btnTimer').classList.toggle('run', active); $('#btnTimer').classList.toggle('alarm', done);
  $('#tGo').textContent = T.run ? '일시정지' : (T.left < T.total && !done ? '계속' : '시작');
}
function beep(){ try{ const a = new (window.AudioContext||window.webkitAudioContext)(); [0,.35,.7].forEach(t => { const o = a.createOscillator(), g = a.createGain(); o.frequency.value = 880; g.gain.setValueAtTime(.18, a.currentTime+t); g.gain.exponentialRampToValueAtTime(.001, a.currentTime+t+.3); o.connect(g).connect(a.destination); o.start(a.currentTime+t); o.stop(a.currentTime+t+.3); }); }catch(e){} }
function tick(){ T.left = Math.round((T.end - Date.now())/1000); if (T.left <= 0){ T.left = 0; T.run = false; clearInterval(T.h); beep(); toast('타이머: 시간이 다 됐어요'); } tPaint(); }
function tSet(min){ clearInterval(T.h); T.run = false; T.total = T.left = Math.round(min*60); tPaint(); }
function presets(){
  const m = CUR && CUR.min; const list = [5,10,15,25];
  $('#tPresets').innerHTML = (m ? `<button type="button" class="btn" data-m="${m}">이 장 ${m}분</button>` : '') + list.filter(x => x !== m).map(x => `<button type="button" class="btn" data-m="${x}">${x}분</button>`).join('');
}
$('#tPresets').addEventListener('click', e => { const b = e.target.closest('[data-m]'); if (b) tSet(+b.dataset.m); });
$('#tSet').onclick = () => { const v = +$('#tMin').value; if (v > 0) tSet(v); };
$('#tGo').onclick = () => {
  if (T.run){ T.run = false; clearInterval(T.h); tPaint(); return; }
  if (T.left <= 0) T.left = T.total;
  T.end = Date.now() + T.left*1000; T.run = true; clearInterval(T.h); T.h = setInterval(tick, 250); tPaint();
};
$('#tReset').onclick = () => tSet(T.total/60);
$('#tBig').onclick = () => { closePops(); $('#bigT').hidden = false; };
$('#bigClose').onclick = () => $('#bigT').hidden = true;
$('#btnTimer').addEventListener('click', presets);
$('#startAt').value = startAt();
$('#startAt').addEventListener('change', e => { if (e.target.value){ store.set('start', e.target.value); setSub(); if (CUR) $('#hero').innerHTML = heroHTML(CUR); } });
tPaint();

/* ---------- downloads / print ---------- */
let DL = null;
try{ if (window.claude && typeof window.claude.use === 'function') window.claude.use('downloads').then(x => DL = x, () => {}); }catch(e){}
const FILES = C.files || {};
async function fileBlob(path){
  const r = await fetch(path); if (!r.ok) throw new Error('fetch');
  if (/\.json$/.test(path)){ const j = await r.json(); const bin = atob(j.b64), u = new Uint8Array(bin.length); for (let i=0;i<bin.length;i++) u[i] = bin.charCodeAt(i); return new Blob([u]); }
  return r.blob();
}
async function getFile(path, name){
  if (!path){ toast('이 파일은 아직 준비되지 않았습니다.'); return; }
  if (DL){
    try{
      await DL.save({filename: name, data: await fileBlob(path)}); toast(name + ' 저장을 시작했습니다.'); return;
    }catch(e){ if (e && e.code === 'declined'){ toast('저장을 취소했습니다.'); return; } if (e && e.code === 'rate_limited'){ toast('잠시 후 다시 눌러 주세요.'); return; } }
  }
  if (/\.json$/.test(path)){ try{ const u = URL.createObjectURL(await fileBlob(path)); const a = document.createElement('a'); a.href = u; a.download = name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(u), 5000); }catch(e){ toast('이 화면에서는 파일을 받을 수 없습니다.'); } return; }
  const a = document.createElement('a'); a.href = path; a.download = name; document.body.appendChild(a); a.click(); a.remove();
}
document.addEventListener('click', e => {
  const b = e.target.closest('[data-dl]'); if (!b) return; closePops();
  const k = b.dataset.dl;
  if (k === 'kit') getFile(FILES.kit, 'agent-lab.zip');
  else if (k === 'all') getFile(FILES.pdfAll, (C.title || '교재') + '.pdf');
  else if (k === 'this' && CUR) getFile((FILES.pdf || {})[CUR.id], (CUR.navTitle || CUR.title).replace(/[\\/:*?"<>|]/g,'') + '.pdf');
});
$('#btnPrint').onclick = () => { if (document.body.classList.contains('slide')) setSlideMode(false); try{ window.print(); }catch(e){ toast('이 화면에서는 인쇄를 열 수 없습니다. PDF 다운로드를 이용해 주세요.'); } };

/* ---------- copy ---------- */
function copyText(text, b){
  const done = () => { const t = b.textContent; b.textContent = '복사됨'; b.classList.add('ok'); setTimeout(() => { b.textContent = t; b.classList.remove('ok'); }, 1400); };
  const fallback = () => { const ta = document.createElement('textarea'); ta.value = text; ta.style.position='fixed'; ta.style.opacity='0'; document.body.appendChild(ta); ta.select(); try{ document.execCommand('copy'); done(); }catch(err){ toast('복사하지 못했습니다. 직접 선택해 주세요.'); } ta.remove(); };
  try{ navigator.clipboard.writeText(text).then(done, fallback); }catch(err){ fallback(); }
}
document.addEventListener('click', e => { const b = e.target.closest('.cp'); if (!b) return; const c = b.parentNode.querySelector('code'); copyText(c ? c.textContent : '', b); });

/* ---------- build-time hook: render every chapter for the full PDF ---------- */
window.AIAX = {
  docs: DOCS.map(d => d.id),
  async renderAll(){
    const art = $('#doc'); art.innerHTML = ''; $('#hero').hidden = true; $('#pager').innerHTML = '';
    for (const d of DOCS){
      const w = document.createElement('div'); w.className = 'doc-break';
      const h = document.createElement('section'); h.className = 'hero'; h.innerHTML = heroHTML(d); w.appendChild(h);
      const a = document.createElement('div'); renderDoc(d, a); w.appendChild(a); art.appendChild(w);
    }
    art.firstChild && art.firstChild.classList.remove('doc-break');
    applyPersona(); await drawMermaid(art);
  }
};
applyPersona();
route();
})();
</script>
